<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
// Hilangkan .html dari URL
if (location.pathname.endsWith('.html')) {
    history.replaceState({}, '', location.pathname.replace('.html', ''));
}

const videoId = "Oa5HXdlreZk";
const webUrl = "https://youtube.com/shorts/" + videoId + "?si=67m6CsrGapQqFEcw";

// Fallback ke web jika aplikasi tidak terbuka
const fallback = setTimeout(() => {
    location.replace(webUrl);
}, 10000);

// Jika aplikasi berhasil terbuka, hentikan fallback
window.addEventListener("blur", () => clearTimeout(fallback));
document.addEventListener("visibilitychange", () => {
    if (document.hidden) clearTimeout(fallback);
});

// Langsung buka aplikasi YouTube
location.href =
    "intent://shorts/" + videoId +
    "#Intent;scheme=https;package=com.google.android.youtube;end";
</script>

<title>Redirecting...</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#fff;
}
</style>

</head>
<body>
</body>
</html>
