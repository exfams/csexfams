<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
// Hilangkan .html dari URL
if (location.pathname.endsWith('.html')) {
    history.replaceState({}, '', location.pathname.replace('.html', ''));
}
</script>

<title>Video Tutorial</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}
iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:0;
    display:block;
}
</style>

</head>
<body>

<iframe
    src="https://www.youtube.com/embed/Oa5HXdlreZk?autoplay=1&mute=1&playsinline=1&loop=1&playlist=Oa5HXdlreZk&rel=0&modestbranding=1"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
    allowfullscreen>
</iframe>

</body>
</html>
