<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan TRX</title>
<link rel="icon" type="image/png" href="https://fmgaming0.wordpress.com/wp-content/uploads/2025/11/1000630391.jpg">
<link rel="apple-touch-icon" href="https://fmgaming0.wordpress.com/wp-content/uploads/2025/11/1000630391.jpg">
<meta name="theme-color" content="#0F1115">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#0F1115;
  color:#E6E9EF;
  -webkit-font-smoothing:antialiased;
}
.profile{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}
.profile-img{
  width:72px;
  height:72px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #262B34;
  background:#181B21;
}
.profile-name{
  font-size:16px;
  font-weight:600;
  color:#E6E9EF;
  margin:0;
}
.card{
  background:#181B21;
  border:1px solid #262B34;
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:10px;
}
h2{
  font-size:12px;
  font-weight:600;
  color:#9AA3B2;
  margin:0 0 8px;
  letter-spacing:.2px;
}
label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:#C4CAD4;
  margin-top:8px;
}
label:first-of-type{margin-top:0}
input[type="text"],
input[type="number"],
input[type="date"],
textarea{
  width:100%;
  padding:8px 10px;
  margin-top:4px;
  border:1px solid #2C323D;
  border-radius:7px;
  font-size:16px;
  color:#E6E9EF;
  background:#101318;
  transition:border-color .15s ease;
  font-family:inherit;
}
input[type="date"]{
  color-scheme:dark;
  min-height:40px;
  min-width:0;
}
textarea{
  resize:none;
  overflow:hidden;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.4;
}
input[type="text"]:focus,
input[type="number"]:focus,
input[type="date"]:focus,
textarea:focus{
  outline:none;
  border-color:#2196f3;
  background:#0D1014;
}
input[type="file"]{
  width:100%;
  font-size:13px;
  padding:8px;
  border:1px dashed #2C323D;
  border-radius:7px;
  background:#101318;
  color:#9AA3B2;
}
#fileName{
  font-size:12px;
  color:#9AA3B2;
  margin:4px 0 0;
}
.hasil{
  background:#262B34;
  color:#FFFFFF;
  padding:12px 14px;
  border-radius:10px;
  line-height:1.5;
  font-size:12.5px;
  border:1px solid #262B34;
}
.hasil strong{
  display:block;
  font-weight:600;
}
.hasil strong:last-child{
  margin-top:6px;
  padding-top:8px;
  border-top:1px solid rgba(255,255,255,.15);
  font-size:13.5px;
  color:#6FE0A6;
}
button{
  width:100%;
  padding:11px 4px;
  margin-top:0;
  border:none;
  border-radius:7px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:opacity .15s ease;
}
button:disabled{opacity:.35;cursor:not-allowed}
#btnLihatHasil{
  background:transparent;
  color:#6FE0A6;
  border:1px solid #2E7D4F;
}
#btnDownload{
  background:#2196f3;
  color:#FFFFFF;
}
#btnShare{
  background:transparent;
  color:#2196f3;
  border:1px solid #2196f3;
}
button:not(:disabled):active{opacity:.8}
#status,
#status2{
  margin-top:10px;
  font-size:13px;
  color:#9AA3B2;
  text-align:center;
  min-height:16px;
}
.preview-wrap{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
}
.nav-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  padding:0;
  margin:0;
  border-radius:50%;
  background:rgba(16,19,24,.85);
  color:#2196f3;
  border:1px solid #2C323D;
  font-size:20px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
#previewCanvas{
  cursor:zoom-in;
  width:100%;
  max-width:100%;
  height:auto;
  border-radius:6px;
  border:1px solid #262B34;
  background:#FFFFFF;
}
.page-info{
  text-align:center;
  font-size:13px;
  color:#9AA3B2;
  margin:0;
  min-width:108px;
}
.page-nav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:10px;
}
.page-nav .nav-btn{
  position:static;
  transform:none;
}
.toggle-group{
  display:flex;
  gap:8px;
  margin-top:6px;
}
.toggle-btn{
  flex:1;
  padding:10px;
  border-radius:7px;
  border:1px solid #2C323D;
  background:#101318;
  color:#9AA3B2;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.toggle-btn.active{
  background:#2196f3;
  color:#FFFFFF;
  border-color:#2196f3;
}
.shift-group{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin-top:8px;
}
.shift-group .nav-btn{
  position:static;
  transform:none;
}
#offsetInfo{
  font-size:14px;
  color:#C4CAD4;
  min-width:64px;
  text-align:center;
}
#btnTutup{
  background:#262B34;
  color:#E6E9EF;
  margin-top:12px;
}
#pager{
  position:fixed;
  inset:0;
  overflow:hidden;
  touch-action:pan-y;
}
#track{
  display:flex;
  width:200%;
  height:100%;
  transition:transform .32s cubic-bezier(.22,.8,.3,1);
  will-change:transform;
}
.pane{
  width:50%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.pane-inner{
  max-width:480px;
  margin:0 auto;
  padding:12px 12px 36px;
}
#dots{
  position:fixed;
  left:0;
  right:0;
  bottom:10px;
  display:flex;
  justify-content:center;
  gap:8px;
  z-index:5;
  pointer-events:none;
}
#dots span{
  width:7px;
  height:7px;
  border-radius:4px;
  background:#3A414D;
  transition:background .2s ease,width .2s ease;
  pointer-events:auto;
  cursor:pointer;
}
#dots span.on{
  background:#2196f3;
  width:18px;
}
.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.row2 + .row2{margin-top:10px}
.row2 > div{min-width:0}
.btn-row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.btn-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.pane-inner.preview-inner{padding:8px 6px 36px}
#pdfPreviewCard{padding:8px}
.zoom-hint{
  text-align:center;
  font-size:11px;
  color:#6B7585;
  margin:6px 0 0;
}
#zoomView{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:#0F1115;
  flex-direction:column;
}
#zoomView.open{display:flex}
#zoomBar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px;
  border-bottom:1px solid #262B34;
}
#zoomBar .nav-btn{
  position:static;
  transform:none;
  width:36px;
  height:36px;
}
#zInfo{
  font-size:13px;
  color:#9AA3B2;
  min-width:96px;
  text-align:center;
}
#zClose{
  width:auto;
  padding:8px 14px;
  margin-left:6px;
  background:#262B34;
  color:#E6E9EF;
}
#zoomScroll{
  flex:1;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y pinch-zoom;
  padding:8px;
}
#zoomCanvas{
  display:block;
  margin:0 auto;
  background:#FFFFFF;
}
.btn-edit{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-top:12px;
  background:transparent;
  color:#2196f3;
  border:1px solid #2196f3;
}
.btn-edit .material-symbols-outlined{font-size:18px}
#editView{
  display:none;
  position:fixed;
  inset:0;
  z-index:60;
  background:#0F1115;
  flex-direction:column;
}
#editView.open{display:flex}
#editBar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border-bottom:1px solid #262B34;
}
.edit-title{
  font-size:14px;
  font-weight:600;
  color:#E6E9EF;
}
#eClose{
  width:auto;
  padding:8px 14px;
  background:#262B34;
  color:#E6E9EF;
}
#editBody{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:12px;
  width:100%;
  max-width:680px;
  margin:0 auto;
}
#eCari{margin-bottom:10px}
#eRekap{margin:10px 0}
.e-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#181B21;
  border:1px solid #262B34;
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:8px;
  font-size:13px;
  color:#E6E9EF;
}
.e-item.edited{border-color:#2E7D4F}
.e-item.warn{border-color:#B7791F}
.e-info{
  min-width:0;
  line-height:1.5;
  word-break:break-word;
}
.e-info span{
  font-size:12px;
  color:#9AA3B2;
}
.e-item.edited .e-info span{color:#6FE0A6}
.e-item.warn .e-info span{color:#F2B34C}
.e-pencil{
  width:40px;
  height:40px;
  padding:0;
  flex:none;
  border-radius:50%;
  background:transparent;
  color:#2196f3;
  border:1px solid #2C323D;
  display:flex;
  align-items:center;
  justify-content:center;
}
.e-pencil .material-symbols-outlined{font-size:20px}
.e-empty{
  text-align:center;
  font-size:13px;
  color:#9AA3B2;
  margin:16px 0;
}
#eSimpan{
  background:#2196f3;
  color:#FFFFFF;
}
#eBatal,
#eReset{
  background:#262B34;
  color:#E6E9EF;
}
#eReset{margin-top:8px}
@media (min-width:600px){
  .pane-inner{max-width:680px;padding-top:32px}
  .card{padding:22px}
  h2{font-size:14px}
}
@media (min-width:900px){
  .pane-inner{max-width:760px}
}
</style>
</head>
<body>



<div id="pager"><div id="track">
<section class="pane" id="paneForm"><div class="pane-inner">

<div class="card">
  <h2>File PDF</h2>

  <p id="fileName"></p>

<div class="btn-row">

</div></section>

<section class="pane" id="panePreview"><div class="pane-inner preview-inner">
<div class="card" id="pdfPreviewCard">
  <h2>Pratinjau PDF</h2>
  <div class="preview-wrap">

  <div class="page-nav">

<div class="hasil" id="hasil2"></div>

<div class="btn-row2">

  <button id="btnShare2" disabled>Share Drive</button>
</div>

</div></div>

<div id="dots"><span class="on" id="dot0"></span><span id="dot1"></span></div>

<div id="zoomView">
  <div id="zoomBar">
    <button type="button" class="nav-btn" id="zFirst" aria-label="Halaman pertama">«</button>
    <button type="button" class="nav-btn" id="zPrev" aria-label="Halaman sebelumnya">‹</button>

    <button type="button" class="nav-btn" id="zLast" aria-label="Halaman terakhir">»</button>

<script>
function rp(n){
  return "Rp" + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function statusEl(){
  return {
    set innerText(v){
      document.querySelectorAll('.status-msg').forEach(function(el){ el.innerText = v; });
    }
  };
}

function formatRibuan(str){
  const digits = str.replace(/\D/g, "");
  if(!digits) return "";
  return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

document.getElementById('pendapatanKotor').addEventListener('input', function(e){
  const posDariKanan = e.target.value.length - e.target.selectionStart;
  e.target.value = formatRibuan(e.target.value);
  const pos = e.target.value.length - posDariKanan;
  e.target.setSelectionRange(pos, pos);
});

document.getElementById('omsetKotorManual').addEventListener('input', function(e){
  const posDariKanan = e.target.value.length - e.target.selectionStart;
  e.target.value = formatRibuan(e.target.value);
  const pos = e.target.value.length - posDariKanan;
  e.target.setSelectionRange(pos, pos);
});

document.getElementById('MODALManual').addEventListener('input', function(e){
  const posDariKanan = e.target.value.length - e.target.selectionStart;
  e.target.value = formatRibuan(e.target.value);
  const pos = e.target.value.length - posDariKanan;
  e.target.setSelectionRange(pos, pos);
});

document.getElementById('penarikanPG').addEventListener('input', function(e){
  const posDariKanan = e.target.value.length - e.target.selectionStart;
  e.target.value = formatRibuan(e.target.value);
  const pos = e.target.value.length - posDariKanan;
  e.target.setSelectionRange(pos, pos);
});

(function(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  document.getElementById('tglPG').value = d.getFullYear() + "-" + mm + "-" + dd;
})();

function tanggalPG(){
  const v = document.getElementById('tglPG').value;
  if(!v) return "";
  const parts = v.split("-");
  return parts[2] + "/" + parts[1] + "/" + parts[0];
}

function angka(){
  return {
    kuota: parseFloat(document.getElementById('kuotaApi').value) || 0,
    trx: parseFloat(document.getElementById('totalTransaksi').value) || 0,
    kotor: parseFloat(document.getElementById('pendapatanKotor').value.replace(/\D/g, "")) || 0,
    omsetManual: parseFloat(document.getElementById('omsetKotorManual').value.replace(/\D/g, "")) || 0,
    MODALManual: parseFloat(document.getElementById('MODALManual').value.replace(/\D/g, "")) || 0,
    penarikan: parseFloat(document.getElementById('penarikanPG').value.replace(/\D/g, "")) || 0,
    tglPG: tanggalPG()
  };
}

function hitung(){
  const {kuota, trx, kotor} = angka();
  const biayaKuota = kuota * trx;
  const bersih = kotor - biayaKuota;

  document.getElementById('hasil').innerHTML =
    "<strong>Kuota API : " + rp(kuota) + " x " + trx + " Total Transaksi = " + rp(biayaKuota) + "</strong>" +
    "<strong>Pendapatan Kotor Harian : " + rp(kotor) + "</strong>" +
    "<strong>Total keseluruhan : " + rp(kotor) + " - " + rp(biayaKuota) + "</strong>" +

'<strong>Total Pendapatan Bersih Harian dikurangi Kuota API = ' +
rp(bersih) +
' <span onclick="salinBersih(this, ' + bersih + ')" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:#2196F3;vertical-align:middle;font-weight:500;">' +
'<span class="material-symbols-outlined" style="font-size:19px;">content_copy</span>' +
'<span class="teks-salin"></span>' +
'</span></strong>';

  document.getElementById('hasil2').innerHTML = document.getElementById('hasil').innerHTML;
}

['kuotaApi','totalTransaksi','pendapatanKotor'].forEach(id=>{
  document.getElementById(id).addEventListener('input', hitung);
});


function salinBersih(el, nominal) {
  navigator.clipboard.writeText(rp(nominal)).then(() => {
    el.querySelector('.material-symbols-outlined').textContent = 'check';
    el.querySelector('.teks-salin').textContent = 'Tersalin.';
  });
}


let uploadedBytes = null;
let posisiMode = 'baru';
let offsetY = 0;
const OFFSET_STEP = 15;

function refreshPreviewIfPossible(){
  if(uploadedBytes && typeof tampilkanPratinjau === 'function'){
    tampilkanPratinjau(false);
  }
}

document.getElementById('btnModeBaru').addEventListener('click', function(){
  posisiMode = 'baru';
  document.getElementById('btnModeBaru').classList.add('active');
  document.getElementById('btnModeTimpa').classList.remove('active');

const satuan = ["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh",
  "sebelas","dua belas","tiga belas","empat belas","lima belas","enam belas","tujuh belas","delapan belas","sembilan belas"];

function terbilang(n){
  n = Math.floor(Math.abs(n));
  if(n < 20) return satuan[n];
  if(n < 100) return (satuan[Math.floor(n/10)]==="satu"?"sepuluh":satuan[Math.floor(n/10)]+" puluh") + (n%10?" "+satuan[n%10]:"");
  if(n < 200) return "seratus" + (n%100?" "+terbilang(n%100):"");
  if(n < 1000) return satuan[Math.floor(n/100)]+" ratus" + (n%100?" "+terbilang(n%100):"");
  if(n < 2000) return "seribu" + (n%1000?" "+terbilang(n%1000):"");
  if(n < 1000000) return terbilang(Math.floor(n/1000))+" ribu" + (n%1000?" "+terbilang(n%1000):"");
  if(n < 1000000000) return terbilang(Math.floor(n/1000000))+" juta" + (n%1000000?" "+terbilang(n%1000000):"");
  return terbilang(Math.floor(n/1000000000))+" miliar" + (n%1000000000?" "+terbilang(n%1000000000):"");
}

function terbilangRupiah(n){
  const t = terbilang(n).trim().replace(/\s+/g,' ');
  return t.charAt(0).toUpperCase() + t.slice(1) + " rupiah";
}

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let previewDoc = null;
let previewPageNum = 1;
let previewTotalPages = 0;

async function renderPreviewPage(num){
  if(!previewDoc) return;
  const page = await previewDoc.getPage(num);
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');
  const container = canvas.parentElement;
  const baseViewport = page.getViewport({scale:1});
  const maxH = window.innerHeight * 110;
  const targetWidth = Math.min(container.clientWidth - 2, maxH * baseViewport.width / baseViewport.height);
  const scale = targetWidth > 0 ? targetWidth / baseViewport.width : 1;
  const viewport = page.getViewport({scale:scale});
  const outputScale = window.devicePixelRatio || 1;
  canvas.width = Math.floor(viewport.width * outputScale);
  canvas.height = Math.floor(viewport.height * outputScale);
  canvas.style.width = Math.floor(viewport.width) + "px";
  canvas.style.height = Math.floor(viewport.height) + "px";
  const transform = outputScale !== 1 ? [outputScale,0,0,outputScale,0,0] : null;
  await page.render({canvasContext: ctx, viewport: viewport, transform: transform}).promise;
  document.getElementById('pageInfo').innerText = "Halaman " + num + " dari " + previewTotalPages;
  document.getElementById('btnFirstPage').disabled = num <= 1;
  document.getElementById('btnPrevPage').disabled = num <= 1;
  document.getElementById('btnNextPage').disabled = num >= previewTotalPages;
  document.getElementById('btnLastPage').disabled = num >= previewTotalPages;
}

document.getElementById('pdfFile').addEventListener('change', function(e){
  const f = e.target.files[0];
  if(!f){
    previewDoc = null;
    return;
  }
  const previewReader = new FileReader();
  previewReader.onload = async function(ev){
    const typedArray = new Uint8Array(ev.target.result);
    previewDoc = await pdfjsLib.getDocument({data: typedArray}).promise;
    previewTotalPages = previewDoc.numPages;
    previewPageNum = 1;
    previewShown = false;
  };
  previewReader.readAsArrayBuffer(f);
});

document.getElementById('btnPrevPage').addEventListener('click', function(){
  if(previewPageNum > 1){
    previewPageNum--;
    renderPreviewPage(previewPageNum);

});

document.getElementById('btnFirstPage').addEventListener('click', function(){

    previewPageNum = 1;
    renderPreviewPage(previewPageNum);
  }
});

document.getElementById('btnLastPage').addEventListener('click', function(){

    previewPageNum = previewTotalPages;

let previewShown = false;

async function tampilkanPratinjau(keepPage){
  const status = statusEl();
  const prevPage = previewPageNum;
  status.innerText = "Memproses pratinjau hasil edit...";
  const bytes = await editPdf();
  if(!bytes) return;
  const typedArray = new Uint8Array(bytes);
  previewDoc = await pdfjsLib.getDocument({data: typedArray}).promise;
  previewTotalPages = previewDoc.numPages;
  previewPageNum = (keepPage && previewShown && prevPage >= 1 && prevPage <= previewTotalPages)
    ? prevPage
    : previewTotalPages;
  previewShown = true;
  await renderPreviewPage(previewPageNum);
  status.innerText = "Menampilkan pratinjau hasil edit.";
}

// ===== Geser kiri-kanan antar halaman (Form <-> Pratinjau) =====
let paneIdx = 0;
const trackEl = document.getElementById('track');
const pagerEl = document.getElementById('pager');

function setPane(i){
  paneIdx = i;
  trackEl.style.transition = '';
  trackEl.style.transform = 'translate3d(' + (-i * 50) + '%,0,0)';
  document.getElementById('dot0').classList.toggle('on', i === 0);
  document.getElementById('dot1').classList.toggle('on', i === 1);
}

function goPane(i){
  setPane(i);
  if(i === 1){
    if(uploadedBytes){
      document.getElementById('pageInfo').innerText = "Memuat pratinjau...";
      tampilkanPratinjau(true);
    } else {
      document.getElementById('pageInfo').innerText = "Upload PDF dulu";
    }
  }
}

let tx0 = 0, ty0 = 0, t0 = 0, dragging = false, locked = false, dxNow = 0;

pagerEl.addEventListener('touchstart', function(e){
  if(e.touches.length !== 1) return;
  tx0 = e.touches[0].clientX;
  ty0 = e.touches[0].clientY;
  t0 = Date.now();
  dragging = false;
  locked = false;
  dxNow = 0;
}, {passive:true});

pagerEl.addEventListener('touchmove', function(e){
  if(e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - tx0;
  const dy = e.touches[0].clientY - ty0;
  if(!locked){
    if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    locked = true;
    dragging = Math.abs(dx) > Math.abs(dy);
    if(dragging) trackEl.style.transition = 'none';
  }
  if(!dragging) return;
  let d = dx;
  if((paneIdx === 0 && d > 0) || (paneIdx === 1 && d < 0)) d = d * 0.25;
  dxNow = d;
  trackEl.style.transform = 'translate3d(calc(' + (-paneIdx * 50) + '% + ' + d + 'px),0,0)';
}, {passive:true});

function endDrag(){
  if(!dragging) return;
  dragging = false;
  const w = pagerEl.clientWidth;
  const v = Math.abs(dxNow) / ((Date.now() - t0) || 1);
  let next = paneIdx;
  if(Math.abs(dxNow) > w * 0.22 || (v > 0.5 && Math.abs(dxNow) > 30)){
    next = dxNow < 0 ? 1 : 0;
  }
  if(next !== paneIdx) goPane(next); else setPane(paneIdx);
}
pagerEl.addEventListener('touchend', endDrag);
pagerEl.addEventListener('touchcancel', endDrag);

document.getElementById('dot0').addEventListener('click', function(){ goPane(0); });
document.getElementById('dot1').addEventListener('click', function(){ goPane(1); });
document.getElementById('btnLihatHasil').addEventListener('click', function(){ goPane(1); });
document.getElementById('btnTutup').addEventListener('click', function(){ goPane(0); });

// ===== Perbesar pratinjau (ketuk gambar) =====
const zoomView = document.getElementById('zoomView');
let zoomRendering = false;
let zoomPending = false;

async function renderZoomPage(num){
  if(!previewDoc) return;
  if(zoomRendering){ zoomPending = true; return; }
  zoomRendering = true;
  try{
    const page = await previewDoc.getPage(num);
    const canvas = document.getElementById('zoomCanvas');
    const box = document.getElementById('zoomScroll');
    const base = page.getViewport({scale:1});
    const targetW = Math.max(box.clientWidth - 16, 200);
    const viewport = page.getViewport({scale: targetW / base.width});
    const out = Math.max(window.devicePixelRatio || 1, 2) * 1.5;
    canvas.width = Math.floor(viewport.width * out);
    canvas.height = Math.floor(viewport.height * out);
    canvas.style.width = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";
    await page.render({
      canvasContext: canvas.getContext('2d'),
      viewport: viewport,
      transform: [out,0,0,out,0,0]
    }).promise;
    box.scrollTop = 0;
    document.getElementById('zInfo').innerText = "Halaman " + num + " dari " + previewTotalPages;
    document.getElementById('zFirst').disabled = num <= 1;
    document.getElementById('zPrev').disabled = num <= 1;
    document.getElementById('zNext').disabled = num >= previewTotalPages;
    document.getElementById('zLast').disabled = num >= previewTotalPages;
  } finally {
    zoomRendering = false;
    if(zoomPending){
      zoomPending = false;
      renderZoomPage(previewPageNum);
    }
  }
}

function zoomKe(n){
  n = Math.max(1, Math.min(previewTotalPages, n));
  if(n === previewPageNum) return;
  previewPageNum = n;
  renderZoomPage(n);
}

document.getElementById('previewCanvas').addEventListener('click', function(){
  if(!previewDoc) return;
  zoomView.classList.add('open');
  renderZoomPage(previewPageNum);
});
document.getElementById('zFirst').addEventListener('click', function(){ zoomKe(1); });
document.getElementById('zPrev').addEventListener('click', function(){ zoomKe(previewPageNum - 1); });
document.getElementById('zNext').addEventListener('click', function(){ zoomKe(previewPageNum + 1); });
document.getElementById('zLast').addEventListener('click', function(){ zoomKe(previewTotalPages); });
document.getElementById('zClose').addEventListener('click', function(){
  zoomView.classList.remove('open');
  renderPreviewPage(previewPageNum);
});

  const ta = document.getElementById('namaFile');
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}
document.getElementById('namaFile').addEventListener('input', autoResizeNamaFile);
window.addEventListener('load', autoResizeNamaFile);

<script>
// ===== Edit Teks PDF (ikon pensil) =====
let origDoc = null;
let parsePromise = null;
let rowsData = {};
let totalsInfo = null;
let totalsAktif = null;
let editMap = {};
let editDirty = false;
let editNoAktif = null;
let lastEditPage = 0;

function angkaDari(str){
  return parseInt(String(str).replace(/\D/g, ""), 10) || 0;
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function mkItem(o){
  return {str:o.str, val:angkaDari(o.str), x:o.x, y:o.y, w:o.w, size:o.size, page:o.page};
}

async function ekstrakPdf(doc){
  rowsData = {};
  totalsInfo = null;
  totalsAktif = null;

  for(let p = 1; p <= doc.numPages; p++){
    const pg = await doc.getPage(p);
    const tc = await pg.getTextContent();
    const W = pg.view[2] - pg.view[0];
    const items = tc.items
      .filter(function(i){ return i.str && i.str.trim(); })
      .map(function(i){
        return {
          str: i.str.trim(),
          x: i.transform[4],
          y: i.transform[5],
          w: i.width,
          size: Math.hypot(i.transform[2], i.transform[3]) || i.height || 8,
          page: p - 1
        };
      });

    const isRp = function(s){ return /^Rp[\d.]+$/.test(s); };
    const sebaris = function(o){
      return items
        .filter(function(i){ return Math.abs(i.y - o.y) < 3; })
        .sort(function(a, b){ return a.x - b.x; });
    };

    items.forEach(function(it){
      if(!/^\d+$/.test(it.str) || it.x > W * 0.15) return;
      const baris = sebaris(it);
      const rpItems = baris.filter(function(i){ return isRp(i.str); });
      if(baris.length < 6 || rpItems.length < 2) return;
      rowsData[it.str] = {
        no: parseInt(it.str, 10),
        page: p - 1,
        nama: baris.slice(3, baris.length - 3).map(function(i){ return i.str; }).join(" "),
        total: mkItem(rpItems[rpItems.length - 2]),
        modal: mkItem(rpItems[rpItems.length - 1])
      };
    });

    const lSampai = items.find(function(i){ return /^Total transaksi sampai/i.test(i.str); });
    const lKes = items.find(function(i){ return /^Total Transaksi keseluruhan/i.test(i.str); });
    const lUntung = items.find(function(i){ return /^Total Keuntungan/i.test(i.str); });

    if(lSampai && lKes && lUntung){
      const dua = function(l){
        const r = sebaris(l).filter(function(i){ return i.x > l.x && isRp(i.str); });
        return r.length >= 2
          ? {total: mkItem(r[r.length - 2]), modal: mkItem(r[r.length - 1])}
          : null;
      };
      const a = dua(lSampai);
      const b = dua(lKes);
      const barisU = sebaris(lUntung).filter(function(i){ return i.x > lUntung.x; });
      const formula = barisU.find(function(i){
        return /^Rp[\d.]+\s*-\s*Rp[\d.]+\s*=?$/.test(i.str);
      });
      const hasil = barisU.filter(function(i){ return isRp(i.str); }).pop();
      if(a && b && formula && hasil){
        totalsInfo = {sampai:a, kes:b, formula:mkItem(formula), hasil:mkItem(hasil)};
      }
    }
  }

  if(totalsInfo){
    const t = totalsInfo.sampai.total.val;
    const m = totalsInfo.sampai.modal.val;
    totalsAktif = {total:t, modal:m, untung:t - m};
  }
}

function hitungTotalBaru(){
  if(!totalsInfo) return null;
  let dT = 0, dM = 0;
  Object.keys(editMap).forEach(function(no){
    const r = rowsData[no];
    const e = editMap[no];
    if(!r) return;
    dT += e.total - r.total.val;
    dM += e.modal - r.modal.val;
  });
  const t = totalsInfo.sampai.total.val + dT;
  const m = totalsInfo.sampai.modal.val + dM;
  return {total:t, modal:m, untung:t - m, dT:dT, dM:dM};
}

function daftarPerubahan(){
  const out = [];
  Object.keys(editMap).forEach(function(no){
    const r = rowsData[no];
    const e = editMap[no];
    if(!r) return;
    if(e.total !== r.total.val){
      out.push(Object.assign({}, r.total, {newStr:rp(e.total), align:'right', bold:false, white:false}));
    }
    if(e.modal !== r.modal.val){
      out.push(Object.assign({}, r.modal, {newStr:rp(e.modal), align:'right', bold:false, white:false}));
    }
  });

  const t = hitungTotalBaru();
  if(out.length && t){
    const I = totalsInfo;
    [I.sampai, I.kes].forEach(function(b){
      out.push(Object.assign({}, b.total, {newStr:rp(b.total.val + t.dT), align:'right', bold:true, white:true}));
      out.push(Object.assign({}, b.modal, {newStr:rp(b.modal.val + t.dM), align:'right', bold:true, white:true}));
    });
    out.push(Object.assign({}, I.formula, {
      newStr: rp(I.kes.total.val + t.dT) + " - " + rp(I.kes.modal.val + t.dM) + " =",
      align:'center', bold:true, white:true
    }));
    out.push(Object.assign({}, I.hasil, {newStr:rp(t.untung), align:'right', bold:true, white:true}));
  }
  return out;
}

async function terapkanEditTeks(pdfDoc, font, fontBold, rgb){
  const daftar = daftarPerubahan();
  if(!daftar.length || !origDoc) return;

  const perHal = {};
  daftar.forEach(function(c){
    (perHal[c.page] = perHal[c.page] || []).push(c);
  });

  for(const key of Object.keys(perHal)){
    const pi = parseInt(key, 10);
    const page = pdfDoc.getPage(pi);
    const op = await origDoc.getPage(pi + 1);
    const vp = op.getViewport({scale:2});
    const cv = document.createElement('canvas');
    cv.width = Math.floor(vp.width);
    cv.height = Math.floor(vp.height);
    const ctx = cv.getContext('2d', {willReadFrequently:true});
    await op.render({canvasContext:ctx, viewport:vp}).promise;

    perHal[key].forEach(function(c){
      const f = c.bold ? fontBold : font;
      const size = c.size;
      const newW = f.widthOfTextAtSize(c.newStr, size);
      const nx = c.align === 'center'
        ? (c.x + c.w / 2 - newW / 2)
        : (c.x + c.w - newW);
      const kiri = Math.min(c.x, nx) - 1.5;
      const kanan = Math.max(c.x + c.w, nx + newW) + 1.5;

      let bg = [1, 1, 1];
      try{
        const pt = vp.convertToViewportPoint(c.x - 2, c.y + size * 0.3);
        const d = ctx.getImageData(
          Math.max(0, Math.round(pt[0])),
          Math.max(0, Math.round(pt[1])),
          1, 1
        ).data;
        bg = [d[0] / 255, d[1] / 255, d[2] / 255];
      }catch(err){}

      page.drawRectangle({
        x:kiri,
        y:c.y - size * 0.28,
        width:kanan - kiri,
        height:size * 1.15,
        color:rgb(bg[0], bg[1], bg[2])
      });
      page.drawText(c.newStr, {
        x:nx,
        y:c.y,
        size:size,
        font:f,
        color: c.white ? rgb(1, 1, 1) : rgb(0, 0, 0)
      });
    });
  }
}

function sinkronForm(lama, baru){
  [['omsetKotorManual','total'], ['MODALManual','modal'], ['pendapatanKotor','untung']].forEach(function(p){
    const el = document.getElementById(p[0]);
    const cur = el.value.replace(/\D/g, "");
    if(cur !== "" && cur === String(Math.max(0, lama[p[1]]))){
      el.value = formatRibuan(String(Math.max(0, baru[p[1]])));
    }
  });
  hitung();
}

function renderRekap(){
  const el = document.getElementById('eRekap');
  const n = Object.keys(editMap).length;
  if(!totalsInfo){
    el.innerHTML = "<div>Total di PDF tidak terbaca, jadi total tidak dihitung ulang.</div>";
    return;
  }
  const I = totalsInfo;
  const t = hitungTotalBaru();
  const untungAsli = I.sampai.total.val - I.sampai.modal.val;
  el.innerHTML =
    "<div>Baris diubah : " + n + "</div>" +
    "<div>Total Transaksi : " + rp(I.sampai.total.val) + " → " + rp(t.total) + "</div>" +
    "<div>Total Modal : " + rp(I.sampai.modal.val) + " → " + rp(t.modal) + "</div>" +
    "<div>Total Keuntungan : " + rp(untungAsli) + " → " + rp(t.untung) + "</div>";
}

function renderDaftarEdit(){
  const q = document.getElementById('eCari').value.trim().toLowerCase();
  const box = document.getElementById('eList');
  let list = Object.keys(rowsData)
    .map(function(k){ return rowsData[k]; })
    .sort(function(a, b){ return a.no - b.no; });

  if(q){
    list = list.filter(function(r){
      return String(r.no) === q || r.nama.toLowerCase().indexOf(q) !== -1;
    });
  } else {
    list = list.filter(function(r){ return editMap[r.no] || r.modal.val === 0; });
  }

  box.innerHTML = "";
  if(!list.length){
    const p = document.createElement('p');
    p.className = 'e-empty';
    p.textContent = q ? "Tidak ditemukan." : "Ketik No atau nama produk untuk mencari baris.";
    box.appendChild(p);
    return;
  }

  list.slice(0, 50).forEach(function(r){
    const e = editMap[r.no];
    const tot = e ? e.total : r.total.val;
    const mod = e ? e.modal : r.modal.val;
    const warn = !e && r.modal.val === 0;
    const div = document.createElement('div');
    div.className = 'e-item' + (e ? ' edited' : '') + (warn ? ' warn' : '');
    div.innerHTML =
      '<div class="e-info"><b>No ' + r.no + '</b> · ' + esc(r.nama) +
      '<br><span>Total ' + rp(tot) + ' · Modal ' + rp(mod) +
      (e ? ' · diubah' : (warn ? ' · modal Rp0, cek' : '')) + '</span></div>' +
      '<button type="button" class="e-pencil" data-no="' + r.no + '" aria-label="Edit">' +
      '<span class="material-symbols-outlined">edit</span></button>';
    box.appendChild(div);
  });
}

function bukaForm(no){
  const r = rowsData[no];
  if(!r) return;
  editNoAktif = no;
  const e = editMap[no];
  document.getElementById('eFormTitle').innerText = "Edit No " + r.no + " · " + r.nama;
  document.getElementById('eTotal').value = formatRibuan(String(e ? e.total : r.total.val));
  document.getElementById('eModal').value = formatRibuan(String(e ? e.modal : r.modal.val));
  document.getElementById('eReset').style.display = e ? 'block' : 'none';
  document.getElementById('eForm').style.display = 'block';
  document.getElementById('editBody').scrollTop = 0;
}

function tutupForm(){
  editNoAktif = null;
  document.getElementById('eForm').style.display = 'none';
}

function perbaruiSetelahEdit(){
  const t = hitungTotalBaru();
  if(t && totalsAktif){
    sinkronForm(totalsAktif, t);
    totalsAktif = {total:t.total, modal:t.modal, untung:t.untung};
  }
  renderDaftarEdit();
  renderRekap();
}

async function bukaEditor(){
  if(!parsePromise){
    statusEl().innerText = "Upload PDF dulu.";
    return;
  }
  statusEl().innerText = "Membaca teks PDF...";
  await parsePromise;
  if(!Object.keys(rowsData).length){
    statusEl().innerText = "Teks baris transaksi tidak terbaca dari PDF ini.";
    return;
  }
  statusEl().innerText = "";
  document.getElementById('eCari').value = "";
  tutupForm();
  renderDaftarEdit();
  renderRekap();
  document.getElementById('editView').classList.add('open');
}

function pasangFormatRibuan(id){
  document.getElementById(id).addEventListener('input', function(e){
    const posDariKanan = e.target.value.length - e.target.selectionStart;
    e.target.value = formatRibuan(e.target.value);
    const pos = e.target.value.length - posDariKanan;
    e.target.setSelectionRange(pos, pos);
  });
}
pasangFormatRibuan('eTotal');
pasangFormatRibuan('eModal');

document.getElementById('pdfFile').addEventListener('change', function(e){
  const f = e.target.files[0];
  origDoc = null;
  rowsData = {};
  totalsInfo = null;
  totalsAktif = null;
  editMap = {};
  editDirty = false;
  if(!f){
    parsePromise = null;
    return;
  }
  parsePromise = new Promise(function(resolve){
    const rd = new FileReader();
    rd.onload = async function(ev){
      try{
        origDoc = await pdfjsLib.getDocument({data: new Uint8Array(ev.target.result)}).promise;
        await ekstrakPdf(origDoc);
      }catch(err){
        console.error(err);
      }
      resolve();
    };
    rd.readAsArrayBuffer(f);
  });
});

document.getElementById('btnEditTeks').addEventListener('click', bukaEditor);
document.getElementById('eCari').addEventListener('input', renderDaftarEdit);

document.getElementById('eList').addEventListener('click', function(ev){
  const b = ev.target.closest('.e-pencil');
  if(b) bukaForm(b.getAttribute('data-no'));
});

document.getElementById('eSimpan').addEventListener('click', function(){
  const r = rowsData[editNoAktif];
  if(!r) return;
  const tot = angkaDari(document.getElementById('eTotal').value);
  const mod = angkaDari(document.getElementById('eModal').value);
  if(tot === r.total.val && mod === r.modal.val){
    delete editMap[editNoAktif];
  } else {
    editMap[editNoAktif] = {total:tot, modal:mod};
  }
  editDirty = true;
  lastEditPage = r.page;
  tutupForm();
  perbaruiSetelahEdit();
});

document.getElementById('eReset').addEventListener('click', function(){
  const r = rowsData[editNoAktif];
  if(!r) return;
  delete editMap[editNoAktif];
  editDirty = true;
  lastEditPage = r.page;
  tutupForm();
  perbaruiSetelahEdit();
});

document.getElementById('eBatal').addEventListener('click', tutupForm);

document.getElementById('eClose').addEventListener('click', function(){
  document.getElementById('editView').classList.remove('open');
  if(editDirty){
    editDirty = false;
    previewPageNum = lastEditPage + 1;
    previewShown = true;
    tampilkanPratinjau(true);
  }
});
</script>
