<style>
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#0F1115;
  color:#E6E9EF;

}
.profile{
  display:flex;
  flex-direction:column;

  gap:10px;
  margin-bottom:20px;
}
.profile-img{

}
.profile-name{
  font-size:16px;
  font-weight:600;

  margin:0;
}
.card{
  background:#181B21;

}
h2{

}
label{
  display:block;

}
label:first-of-type{margin-top:0}
input[type="text"],
input[type="number"],
input[type="date"],
textarea{

}
input[type="date"]{

}
textarea{

  overflow:hidden;
  white-space:pre-wrap;

}
input[type="text"]:focus,
input[type="number"]:focus,
input[type="date"]:focus,
textarea:focus{

}
input[type="file"]{

}
#fileName{

}
.hasil{

}
button{

  padding:11px 4px;
  margin-top:0;
  border:none;
  border-radius:7px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;

}
button:disabled{opacity:.35;cursor:not-allowed}
#btnLihatHasil{
  background:transparent;
  color:#6FE0A6;
  border:1px solid #2E7D4F;
}
#btnDownload{
  background:#2196f3;
  color:#FFFFFF;
}
#btnShare{

  color:#2196f3;
  border:1px solid #2196f3;
}
button:not(:disabled):active{opacity:.8}
#status{
  margin-top:10px;
  font-size:13px;
  color:#9AA3B2;
  text-align:center;
  min-height:16px;
}
.preview-wrap{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
}
.nav-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  padding:0;
  margin:0;
  border-radius:50%;
  background:rgba(16,19,24,.85);
  color:#2196f3;
  border:1px solid #2C323D;
  font-size:20px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
#previewCanvas{
  width:100%;
  max-width:100%;
  height:auto;
  border-radius:6px;
  border:1px solid #262B34;
  background:#FFFFFF;
}
.page-info{
  text-align:center;
  font-size:13px;
  color:#9AA3B2;
  margin:0;
  min-width:108px;
}
.page-nav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:10px;
}
.page-nav .nav-btn{
  position:static;
  transform:none;
}
.toggle-group{
  display:flex;
  gap:8px;
  margin-top:6px;
}
.toggle-btn{
  flex:1;
  padding:10px;
  border-radius:7px;
  border:1px solid #2C323D;

  color:#9AA3B2;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.toggle-btn.active{
  background:#2196f3;
  color:#FFFFFF;
  border-color:#2196f3;
}
.shift-group{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin-top:8px;
}
.shift-group .nav-btn{
  position:static;

}
#offsetInfo{

#btnTutup{

#track{

  height:100%;
  transition:transform .32s cubic-bezier(.22,.8,.3,1);

}
.pane{
  width:50%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;

.pane-inner{

}
#dots{

#dots span{

}
.row2{

  gap:10px;
}
.row2 + .row2{margin-top:10px}
.row2 > div{min-width:0}

<script>
function rp(n){
  return "Rp" + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function formatRibuan(str){
  const digits = str.replace(/\D/g, "");
  if(!digits) return "";
  return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

document.getElementById('pendapatanKotor').addEventListener('input', function(e){
  const posDariKanan = e.target.value.length - e.target.selectionStart;
  e.target.value = formatRibuan(e.target.value);
  const pos = e.target.value.length - posDariKanan;
  e.target.setSelectionRange(pos, pos);
});

document.getElementById('omsetKotorManual').addEventListener('input', function(e){
  const posDariKanan = e.target.value.length - e.target.selectionStart;
  e.target.value = formatRibuan(e.target.value);
  const pos = e.target.value.length - posDariKanan;
  e.target.setSelectionRange(pos, pos);
});

document.getElementById('MODALManual').addEventListener('input', function(e){
  const posDariKanan = e.target.value.length - e.target.selectionStart;
  e.target.value = formatRibuan(e.target.value);
  const pos = e.target.value.length - posDariKanan;
  e.target.setSelectionRange(pos, pos);
});

document.getElementById('penarikanPG').addEventListener('input', function(e){
  const posDariKanan = e.target.value.length - e.target.selectionStart;
  e.target.value = formatRibuan(e.target.value);
  const pos = e.target.value.length - posDariKanan;
  e.target.setSelectionRange(pos, pos);
});

(function(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  document.getElementById('tglPG').value = d.getFullYear() + "-" + mm + "-" + dd;
})();

function tanggalPG(){
  const v = document.getElementById('tglPG').value;
  if(!v) return "";
  const parts = v.split("-");
  return parts[2] + "/" + parts[1] + "/" + parts[0];
}

function angka(){
  return {
    kuota: parseFloat(document.getElementById('kuotaApi').value) || 0,
    trx: parseFloat(document.getElementById('totalTransaksi').value) || 0,
    kotor: parseFloat(document.getElementById('pendapatanKotor').value.replace(/\D/g, "")) || 0,
    omsetManual: parseFloat(document.getElementById('omsetKotorManual').value.replace(/\D/g, "")) || 0,
    MODALManual: parseFloat(document.getElementById('MODALManual').value.replace(/\D/g, "")) || 0,
    penarikan: parseFloat(document.getElementById('penarikanPG').value.replace(/\D/g, "")) || 0,
    tglPG: tanggalPG()
  };
}

function hitung(){
  const {kuota, trx, kotor} = angka();
  const biayaKuota = kuota * trx;
  const bersih = kotor - biayaKuota;

  document.getElementById('hasil').innerHTML =
    "<strong>Kuota API : " + rp(kuota) + " x " + trx + " Total Transaksi = " + rp(biayaKuota) + "</strong>" +
    "<strong>Pendapatan Kotor Harian : " + rp(kotor) + "</strong>" +
    "<strong>Total keseluruhan : " + rp(kotor) + " - " + rp(biayaKuota) + "</strong>" +

'<strong>Total Pendapatan Bersih Harian dikurangi Kuota API = ' +
rp(bersih) +
' <span onclick="salinBersih(this, ' + bersih + ')" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:#2196F3;vertical-align:middle;font-weight:500;">' +
'<span class="material-symbols-outlined" style="font-size:19px;">content_copy</span>' +
'<span class="teks-salin"></span>' +
'</span></strong>';

}

['kuotaApi','totalTransaksi','pendapatanKotor'].forEach(id=>{
  document.getElementById(id).addEventListener('input', hitung);
});


function salinBersih(el, nominal) {
  navigator.clipboard.writeText(rp(nominal)).then(() => {
    el.querySelector('.material-symbols-outlined').textContent = 'check';
    el.querySelector('.teks-salin').textContent = 'Tersalin.';
  });
}


let uploadedBytes = null;
let posisiMode = 'baru';
let offsetY = 0;
const OFFSET_STEP = 15;

function refreshPreviewIfPossible(){
  if(uploadedBytes && typeof tampilkanPratinjau === 'function'){
    tampilkanPratinjau(false);
  }
}

document.getElementById('btnModeBaru').addEventListener('click', function(){
  posisiMode = 'baru';
  document.getElementById('btnModeBaru').classList.add('active');
  document.getElementById('btnModeTimpa').classList.remove('active');
  refreshPreviewIfPossible();
});

document.getElementById('btnModeTimpa').addEventListener('click', function(){
  posisiMode = 'timpa';
  document.getElementById('btnModeTimpa').classList.add('active');
  document.getElementById('btnModeBaru').classList.remove('active');
  refreshPreviewIfPossible();
});

document.getElementById('btnGeserAtas').addEventListener('click', function(){
  offsetY += OFFSET_STEP;
  document.getElementById('offsetInfo').innerText = offsetY + " px";
  refreshPreviewIfPossible();
});

document.getElementById('btnGeserBawah').addEventListener('click', function(){
  offsetY -= OFFSET_STEP;
  document.getElementById('offsetInfo').innerText = offsetY + " px";
  refreshPreviewIfPossible();
});

document.getElementById('pdfFile').addEventListener('change', function(e){
  const f = e.target.files[0];
  document.getElementById('fileName').innerText = f ? "File: " + f.name : "";
  document.getElementById('btnLihatHasil').disabled = !f;
  document.getElementById('btnDownload').disabled = !f;
  document.getElementById('btnShare').disabled = !f;
  if(f){
    const reader = new FileReader();
    reader.onload = function(ev){ uploadedBytes = ev.target.result; };
    reader.readAsArrayBuffer(f);
  }
});

const satuan = ["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh",
  "sebelas","dua belas","tiga belas","empat belas","lima belas","enam belas","tujuh belas","delapan belas","sembilan belas"];

function terbilang(n){
  n = Math.floor(Math.abs(n));
  if(n < 20) return satuan[n];
  if(n < 100) return (satuan[Math.floor(n/10)]==="satu"?"sepuluh":satuan[Math.floor(n/10)]+" puluh") + (n%10?" "+satuan[n%10]:"");
  if(n < 200) return "seratus" + (n%100?" "+terbilang(n%100):"");
  if(n < 1000) return satuan[Math.floor(n/100)]+" ratus" + (n%100?" "+terbilang(n%100):"");
  if(n < 2000) return "seribu" + (n%1000?" "+terbilang(n%1000):"");
  if(n < 1000000) return terbilang(Math.floor(n/1000))+" ribu" + (n%1000?" "+terbilang(n%1000):"");
  if(n < 1000000000) return terbilang(Math.floor(n/1000000))+" juta" + (n%1000000?" "+terbilang(n%1000000):"");
  return terbilang(Math.floor(n/1000000000))+" miliar" + (n%1000000000?" "+terbilang(n%1000000000):"");
}

function terbilangRupiah(n){
  const t = terbilang(n).trim().replace(/\s+/g,' ');
  return t.charAt(0).toUpperCase() + t.slice(1) + " rupiah";
}

async function editPdf(){
  if(!uploadedBytes){ document.getElementById('status').innerText = "Upload PDF dulu."; return null; }

  const {kuota, trx, kotor, omsetManual, MODALManual, penarikan, tglPG} = angka();
  const biayaKuota = kuota * trx;
  const bersih = kotor - biayaKuota;

  const {PDFDocument, StandardFonts, rgb} = PDFLib;
  const pdfDoc = await PDFDocument.load(uploadedBytes);
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

  const lastPage = pdfDoc.getPage(pdfDoc.getPageCount()-1);
  const {width, height} = lastPage.getSize();
  const page = posisiMode === 'timpa' ? lastPage : pdfDoc.addPage([width, height]);

  let startY = posisiMode === 'baru' ? (height - 100 + offsetY) : (height - 230 + offsetY); //ini nih//

  const blue = rgb(33/255,150/255,243/255);
  const darkBlue = rgb(13/255,71/255,161/255);
  const green = rgb(48/255,199/255,49/255);
  const purple = rgb(106/255,27/255,154/255);
  const white = rgb(1,1,1);
  const textDark = rgb(30/255,41/255,59/255);
  const rowLight = rgb(245/255,247/255,250/255);
  const borderGray = rgb(215/255,221/255,230/255);
  const labelBlue = rgb(190/255,208/255,240/255);
  
  const margin = 30;
  const boxW = width - margin*2;
  const halfW = (boxW - 8) / 2;
  const pad = 12;

  function teksKanan(text, rightX, y, size, f, color){
    const w = f.widthOfTextAtSize(text, size);
    page.drawText(text, {x:rightX - w, y:y, size:size, font:f, color:color});
  }

  // ===== Baris atas: Omset Transaksi & Modal =====
  const topY = startY + 36;

  page.drawRectangle({x:margin, y:topY, width:halfW, height:36, color:darkBlue});
  page.drawText("OMSET TRANSAKSI",
    {x:margin+pad, y:topY+23, size:8, font:fontBold, color:labelBlue});
  page.drawText(rp(omsetManual),
    {x:margin+pad, y:topY+8, size:14, font:fontBold, color:white});

  page.drawRectangle({x:margin+halfW+8, y:topY, width:halfW, height:36, color:darkBlue});
  page.drawText("MODAL",
    {x:margin+halfW+8+pad, y:topY+23, size:8, font:fontBold, color:labelBlue});
  page.drawText(rp(MODALManual),
    {x:margin+halfW+8+pad, y:topY+8, size:14, font:fontBold, color:white});

  // ===== Tabel rincian perhitungan =====
  const rowH = 20;
  const tableTop = startY + 28;

  page.drawRectangle({x:margin, y:tableTop-rowH, width:boxW, height:rowH, color:blue});
  page.drawText("RINCIAN PERHITUNGAN",
    {x:margin+pad, y:tableTop-rowH+6, size:9, font:fontBold, color:white});

  const rows = [
    ["Kuota API per Transaksi", rp(kuota)],
    ["Total Transaksi", String(trx)],
    ["Biaya Kuota API (" + rp(kuota) + " x " + trx + ")", rp(biayaKuota)],
    ["Pendapatan Kotor", rp(kotor)]
  ];

  rows.forEach(function(r, i){
    const ry = tableTop - rowH*(i+2);
    page.drawRectangle({
      x:margin, y:ry, width:boxW, height:rowH,
      color: (i % 2 === 0) ? rowLight : white,
      borderColor:borderGray, borderWidth:0.5
    });
    page.drawText(r[0], {x:margin+pad, y:ry+6, size:10, font:font, color:textDark});
    teksKanan(r[1], margin+boxW-pad, ry+6, 10, fontBold, textDark);
  });

  // ===== KHUSUS: Penarikan Payment Gateway (opsional, masih dalam tabel) =====
  let extra = 0;
  if(penarikan > 0){
    extra = rowH * 2;
    const hy = tableTop - rowH*6;
    page.drawRectangle({x:margin, y:hy, width:boxW, height:rowH, color:blue});
    page.drawText(tglPG ? "Penarikan dana PG di tanggal " + tglPG : "Penarikan dana PG",
      {x:margin+pad, y:hy+6, size:9, font:fontBold, color:white});

    const ry2 = tableTop - rowH*7;
    page.drawRectangle({
      x:margin, y:ry2, width:boxW, height:rowH,
      color:white, borderColor:borderGray, borderWidth:0.5
    });
    page.drawText("Penarikan Payment Gateway", {x:margin+pad, y:ry2+6, size:10, font:font, color:textDark});
    teksKanan(rp(penarikan), margin+boxW-pad, ry2+6, 10, fontBold, textDark);
  }

  // ===== Kotak total pendapatan bersih =====
  const gy = startY - 134 - extra;
  page.drawRectangle({x:margin, y:gy, width:boxW, height:54, color:green});
  page.drawText("TOTAL PENDAPATAN BERSIH (SETELAH BIAYA KUOTA API)",
    {x:margin+pad, y:gy+40, size:9, font:fontBold, color:white});
  page.drawText(rp(bersih),
    {x:margin+pad, y:gy+19, size:18, font:fontBold, color:white});
  page.drawText("(" + terbilangRupiah(bersih) + ".)",
    {x:margin+pad, y:gy+6, size:8.5, font:font, color:white});


  const bytes = await pdfDoc.save();
  return bytes;
}

function getNamaFile(){
  let n = document.getElementById('namaFile').value.trim() || "hasil-edit.pdf";
  if(!n.toLowerCase().endsWith('.pdf')) n += ".pdf";
  return n;
}

function namaFileKemarin(){
  const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const d = new Date();
  d.setDate(d.getDate() - 1);
  const dd = String(d.getDate()).padStart(2, "0");
return "Laporan TRX FamsssPay " + dd + "-" + bulan[d.getMonth()] + "-" + d.getFullYear() + ".pdf";
}

document.getElementById('namaFile').value = namaFileKemarin();

document.getElementById('btnDownload').addEventListener('click', async function(){
  const status = document.getElementById('status');
  status.innerText = "Memproses...";
  const bytes = await editPdf();
  if(!bytes) return;
  const blob = new Blob([bytes], {type:"application/pdf"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = getNamaFile();
  a.click();
  URL.revokeObjectURL(url);
  status.innerText = "Selesai, PDF terunduh.";
});

document.getElementById('btnShare').addEventListener('click', async function(){
  const status = document.getElementById('status');
  status.innerText = "Memproses...";
  const bytes = await editPdf();
  if(!bytes) return;
  const file = new File([bytes], getNamaFile(), {type:"application/pdf"});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:getNamaFile()});
      status.innerText = "Silakan pilih Google Drive di menu share.";
    }catch(err){
      status.innerText = "Share dibatalkan.";
    }
  } else {
    const blob = new Blob([bytes], {type:"application/pdf"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = getNamaFile();
    a.click();
    URL.revokeObjectURL(url);
    window.open("https://drive.google.com/drive/my-drive", "_blank");
    status.innerText = "Browser tidak mendukung share langsung. File terunduh, silakan upload manual ke Google Drive yang baru dibuka.";
  }
});

hitung();
</script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let previewDoc = null;
let previewPageNum = 1;
let previewTotalPages = 0;

async function renderPreviewPage(num){
  if(!previewDoc) return;
  const page = await previewDoc.getPage(num);
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');
  const container = canvas.parentElement;
  const baseViewport = page.getViewport({scale:1});
  const maxH = window.innerHeight * 0.42;
  const targetWidth = Math.min(container.clientWidth - 16, maxH * baseViewport.width / baseViewport.height);
  const scale = targetWidth > 0 ? targetWidth / baseViewport.width : 1;
  const viewport = page.getViewport({scale:scale});
  const outputScale = window.devicePixelRatio || 1;
  canvas.width = Math.floor(viewport.width * outputScale);
  canvas.height = Math.floor(viewport.height * outputScale);
  canvas.style.width = Math.floor(viewport.width) + "px";
  canvas.style.height = Math.floor(viewport.height) + "px";
  const transform = outputScale !== 1 ? [outputScale,0,0,outputScale,0,0] : null;
  await page.render({canvasContext: ctx, viewport: viewport, transform: transform}).promise;
  document.getElementById('pageInfo').innerText = "Halaman " + num + " dari " + previewTotalPages;
  document.getElementById('btnFirstPage').disabled = num <= 1;
  document.getElementById('btnPrevPage').disabled = num <= 1;
  document.getElementById('btnNextPage').disabled = num >= previewTotalPages;
  document.getElementById('btnLastPage').disabled = num >= previewTotalPages;
}

document.getElementById('pdfFile').addEventListener('change', function(e){
  const f = e.target.files[0];
  if(!f){
    previewDoc = null;
    return;
  }
  const previewReader = new FileReader();
  previewReader.onload = async function(ev){
    const typedArray = new Uint8Array(ev.target.result);
    previewDoc = await pdfjsLib.getDocument({data: typedArray}).promise;
    previewTotalPages = previewDoc.numPages;
    previewPageNum = 1;
  };
  previewReader.readAsArrayBuffer(f);
});

document.getElementById('btnPrevPage').addEventListener('click', function(){
  if(previewPageNum > 1){
    previewPageNum--;
    renderPreviewPage(previewPageNum);
  }
});

document.getElementById('btnFirstPage').addEventListener('click', function(){
  if(previewPageNum !== 1){
    previewPageNum = 1;
    renderPreviewPage(previewPageNum);
  }
});

document.getElementById('btnLastPage').addEventListener('click', function(){
  if(previewPageNum !== previewTotalPages){
    previewPageNum = previewTotalPages;
    renderPreviewPage(previewPageNum);
  }
});

document.getElementById('btnNextPage').addEventListener('click', function(){
  if(previewPageNum < previewTotalPages){
    previewPageNum++;
    renderPreviewPage(previewPageNum);
  }
});

async function tampilkanPratinjau(doScroll){
  const status = document.getElementById('status');
  status.innerText = "Memproses pratinjau hasil edit...";
  const bytes = await editPdf();
  if(!bytes) return;
  const typedArray = new Uint8Array(bytes);
  previewDoc = await pdfjsLib.getDocument({data: typedArray}).promise;
  previewTotalPages = previewDoc.numPages;
  previewPageNum = previewTotalPages;
  await renderPreviewPage(previewPageNum);
  status.innerText = "Menampilkan pratinjau hasil edit.";
}

// ===== Geser kiri-kanan antar halaman (Form <-> Pratinjau) =====
let paneIdx = 0;
const trackEl = document.getElementById('track');
const pagerEl = document.getElementById('pager');

function setPane(i){
  paneIdx = i;
  trackEl.style.transition = '';
  trackEl.style.transform = 'translate3d(' + (-i * 50) + '%,0,0)';
  document.getElementById('dot0').classList.toggle('on', i === 0);
  document.getElementById('dot1').classList.toggle('on', i === 1);
}

function goPane(i){
  setPane(i);
  if(i === 1){
    if(uploadedBytes){
      document.getElementById('pageInfo').innerText = "Memuat pratinjau...";
      tampilkanPratinjau(false);
    } else {
      document.getElementById('pageInfo').innerText = "Upload PDF dulu";
    }
  }
}

let tx0 = 0, ty0 = 0, t0 = 0, dragging = false, locked = false, dxNow = 0;

pagerEl.addEventListener('touchstart', function(e){
  if(e.touches.length !== 1) return;
  tx0 = e.touches[0].clientX;
  ty0 = e.touches[0].clientY;
  t0 = Date.now();
  dragging = false;
  locked = false;
  dxNow = 0;
}, {passive:true});

pagerEl.addEventListener('touchmove', function(e){
  if(e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - tx0;
  const dy = e.touches[0].clientY - ty0;
  if(!locked){
    if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    locked = true;
    dragging = Math.abs(dx) > Math.abs(dy);
    if(dragging) trackEl.style.transition = 'none';
  }
  if(!dragging) return;
  let d = dx;
  if((paneIdx === 0 && d > 0) || (paneIdx === 1 && d < 0)) d = d * 0.25;
  dxNow = d;
  trackEl.style.transform = 'translate3d(calc(' + (-paneIdx * 50) + '% + ' + d + 'px),0,0)';
}, {passive:true});

function endDrag(){
  if(!dragging) return;
  dragging = false;
  const w = pagerEl.clientWidth;
  const v = Math.abs(dxNow) / ((Date.now() - t0) || 1);
  let next = paneIdx;
  if(Math.abs(dxNow) > w * 0.22 || (v > 0.5 && Math.abs(dxNow) > 30)){
    next = dxNow < 0 ? 1 : 0;
  }
  if(next !== paneIdx) goPane(next); else setPane(paneIdx);
}
pagerEl.addEventListener('touchend', endDrag);
pagerEl.addEventListener('touchcancel', endDrag);

document.getElementById('dot0').addEventListener('click', function(){ goPane(0); });
document.getElementById('dot1').addEventListener('click', function(){ goPane(1); });
document.getElementById('btnLihatHasil').addEventListener('click', function(){ goPane(1); });
document.getElementById('btnTutup').addEventListener('click', function(){ goPane(0); });

function autoResizeNamaFile(){
  const ta = document.getElementById('namaFile');
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}
document.getElementById('namaFile').addEventListener('input', autoResizeNamaFile);
window.addEventListener('load', autoResizeNamaFile);
</script>
