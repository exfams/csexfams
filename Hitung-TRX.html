<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan TRX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  max-width:480px;
  margin:0 auto;
  padding:28px 18px 56px;
  background:#0F1115;
  color:#E6E9EF;
  -webkit-font-smoothing:antialiased;
}
.card{
  background:#181B21;
  border:1px solid #262B34;
  border-radius:10px;
  padding:22px;
  margin-bottom:16px;
}
h2{
  font-size:14px;
  font-weight:600;
  color:#9AA3B2;
  margin:0 0 16px;
  letter-spacing:.2px;
}
label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:#C4CAD4;
  margin-top:14px;
}
label:first-of-type{margin-top:0}
input[type="text"],
input[type="number"],
textarea{
  width:100%;
  padding:10px 12px;
  margin-top:6px;
  border:1px solid #2C323D;
  border-radius:7px;
  font-size:15px;
  color:#E6E9EF;
  background:#101318;
  transition:border-color .15s ease;
  font-family:inherit;
}
textarea{
  resize:none;
  overflow:hidden;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.4;
}
input[type="text"]:focus,
input[type="number"]:focus,
textarea:focus{
  outline:none;
  border-color:#2196f3;
  background:#0D1014;
}
input[type="file"]{
  width:100%;
  font-size:14px;
  padding:10px;
  border:1px dashed #2C323D;
  border-radius:7px;
  background:#101318;
  color:#9AA3B2;
}
#fileName{
  font-size:13px;
  color:#9AA3B2;
  margin:8px 0 0;
}
.hasil{
  background:#262B34;
  color:#FFFFFF;
  padding:18px 20px;
  border-radius:10px;
  line-height:1.75;
  font-size:14px;
  border:1px solid #262B34;
}
.hasil strong{
  display:block;
  font-weight:600;
}
.hasil strong:last-child{
  margin-top:8px;
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,.15);
  font-size:15px;
  color:#6FE0A6;
}
button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:7px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:opacity .15s ease;
}
button:disabled{opacity:.35;cursor:not-allowed}
#btnLihatHasil{
  background:transparent;
  color:#6FE0A6;
  border:1px solid #2E7D4F;
}
#btnDownload{
  background:#2196f3;
  color:#FFFFFF;
}
#btnShare{
  background:transparent;
  color:#2196f3;
  border:1px solid #2196f3;
}
button:not(:disabled):active{opacity:.8}
#status{
  margin-top:10px;
  font-size:13px;
  color:#9AA3B2;
  text-align:center;
  min-height:16px;
}
.preview-wrap{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
}
.nav-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  padding:0;
  margin:0;
  border-radius:50%;
  background:rgba(16,19,24,.85);
  color:#2196f3;
  border:1px solid #2C323D;
  font-size:20px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}
#btnPrevPage{left:6px}
#btnNextPage{right:6px}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
#previewCanvas{
  width:100%;
  max-width:100%;
  height:auto;
  border-radius:6px;
  border:1px solid #262B34;
  background:#FFFFFF;
}
.page-info{
  text-align:center;
  font-size:13px;
  color:#9AA3B2;
  margin:12px 0 0;
}
@media (min-width:600px){
  body{
    max-width:680px;
    padding:44px 32px 72px;
  }
  .card{padding:28px}
  h2{font-size:15px}
  #previewCanvas{max-height:720px;width:auto}
}
@media (min-width:900px){
  body{max-width:760px}
}
</style>
</head>
<body>

<div class="card">
  <h2>Upload File PDF</h2>
  <input type="file" id="pdfFile" accept="application/pdf">
  <p id="fileName"></p>
</div>

<div class="card" id="pdfPreviewCard" style="display:none">
  <h2>Pratinjau PDF</h2>
  <div class="preview-wrap">
    <button type="button" class="nav-btn" id="btnPrevPage" aria-label="Halaman sebelumnya">‹</button>
    <canvas id="previewCanvas"></canvas>
    <button type="button" class="nav-btn" id="btnNextPage" aria-label="Halaman berikutnya">›</button>
  </div>
  <p class="page-info" id="pageInfo"></p>
</div>

<div class="card">
  <h2>Nama File Hasil Edit</h2>
  <textarea id="namaFile" rows="1">hasil-edit.pdf</textarea>
</div>

<div class="card">
  <h2>Form Kalkulasi</h2>
  <label>Kuota API (Rp)</label>
  <input type="number" id="kuotaApi" value="">

  <label>Total Transaksi</label>
  <input type="number" id="totalTransaksi" value="">

  <label>Pendapatan Kotor (Rp)</label>
  <input type="text" id="pendapatanKotor" inputmode="numeric" value="">
</div>

<div class="hasil" id="hasil"></div>

<button id="btnLihatHasil" disabled>Lihat Hasil Edit</button>
<button id="btnDownload" disabled>Download PDF Hasil Edit</button>
<button id="btnShare" disabled>Share ke Google Drive</button>
<div id="status"></div>

<script>
function rp(n){
  return "Rp" + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function formatRibuan(str){
  const digits = str.replace(/\D/g, "");
  if(!digits) return "";
  return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

document.getElementById('pendapatanKotor').addEventListener('input', function(e){
  const posDariKanan = e.target.value.length - e.target.selectionStart;
  e.target.value = formatRibuan(e.target.value);
  const pos = e.target.value.length - posDariKanan;
  e.target.setSelectionRange(pos, pos);
});

function angka(){
  return {
    kuota: parseFloat(document.getElementById('kuotaApi').value) || 0,
    trx: parseFloat(document.getElementById('totalTransaksi').value) || 0,
    kotor: parseFloat(document.getElementById('pendapatanKotor').value.replace(/\D/g, "")) || 0
  };
}

function hitung(){
  const {kuota, trx, kotor} = angka();
  const biayaKuota = kuota * trx;
  const bersih = kotor - biayaKuota;

  document.getElementById('hasil').innerHTML =
    "<strong>Kuota API : " + rp(kuota) + " x " + trx + " Total Transaksi = " + rp(biayaKuota) + "</strong>" +
    "<strong>Pendapatan Kotor Harian : " + rp(kotor) + "</strong>" +
    "<strong>Total keseluruhan : " + rp(kotor) + " - " + rp(biayaKuota) + "</strong>" +
    "<strong>Total Pendapatan Bersih Harian dikurangi Kuota API = " + rp(bersih) + "</strong>";
}

['kuotaApi','totalTransaksi','pendapatanKotor'].forEach(id=>{
  document.getElementById(id).addEventListener('input', hitung);
});

let uploadedBytes = null;

document.getElementById('pdfFile').addEventListener('change', function(e){
  const f = e.target.files[0];
  document.getElementById('fileName').innerText = f ? "File: " + f.name : "";
  document.getElementById('btnLihatHasil').disabled = !f;
  document.getElementById('btnDownload').disabled = !f;
  document.getElementById('btnShare').disabled = !f;
  if(f){
    const reader = new FileReader();
    reader.onload = function(ev){ uploadedBytes = ev.target.result; };
    reader.readAsArrayBuffer(f);
  }
});

const satuan = ["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh",
  "sebelas","dua belas","tiga belas","empat belas","lima belas","enam belas","tujuh belas","delapan belas","sembilan belas"];

function terbilang(n){
  n = Math.floor(Math.abs(n));
  if(n < 20) return satuan[n];
  if(n < 100) return (satuan[Math.floor(n/10)]==="satu"?"sepuluh":satuan[Math.floor(n/10)]+" puluh") + (n%10?" "+satuan[n%10]:"");
  if(n < 200) return "seratus" + (n%100?" "+terbilang(n%100):"");
  if(n < 1000) return satuan[Math.floor(n/100)]+" ratus" + (n%100?" "+terbilang(n%100):"");
  if(n < 2000) return "seribu" + (n%1000?" "+terbilang(n%1000):"");
  if(n < 1000000) return terbilang(Math.floor(n/1000))+" ribu" + (n%1000?" "+terbilang(n%1000):"");
  if(n < 1000000000) return terbilang(Math.floor(n/1000000))+" juta" + (n%1000000?" "+terbilang(n%1000000):"");
  return terbilang(Math.floor(n/1000000000))+" miliar" + (n%1000000000?" "+terbilang(n%1000000000):"");
}

function terbilangRupiah(n){
  const t = terbilang(n).trim().replace(/\s+/g,' ');
  return t.charAt(0).toUpperCase() + t.slice(1) + " rupiah";
}

async function editPdf(){
  if(!uploadedBytes){ document.getElementById('status').innerText = "Upload PDF dulu."; return null; }

  const {kuota, trx, kotor} = angka();
  const biayaKuota = kuota * trx;
  const bersih = kotor - biayaKuota;

  const {PDFDocument, StandardFonts, rgb} = PDFLib;
  const pdfDoc = await PDFDocument.load(uploadedBytes);
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

  const page = pdfDoc.getPage(pdfDoc.getPageCount()-1);
  const {width, height} = page.getSize();

  let startY = height - 230; //ini nih//

  const blue = rgb(33/255,150/255,243/255);
  const green = rgb(46/255,125/255,50/255);
  const white = rgb(1,1,1);
  const margin = 30;
  const boxW = width - margin*2;

  page.drawRectangle({x:margin, y:startY, width:boxW, height:30, color:blue});
  page.drawText(
    "Kuota API : " + rp(kuota) + "/trx    Total Transaksi : " + trx + "    Total keseluruhan : " + rp(kuota) + " x " + trx + " = " + rp(biayaKuota),
    {x:margin+8, y:startY+11, size:12, font:fontBold, color:white});

  page.drawRectangle({x:margin, y:startY-36, width:boxW, height:30, color:blue});
  page.drawText(
    "Pendapatan Kotor : " + rp(kotor) + " dikurangi Biaya Kuota API " + rp(biayaKuota) + " = " + rp(bersih),
    {x:margin+8, y:startY-25, size:12, font:fontBold, color:white});

  page.drawRectangle({x:margin, y:startY-94, width:boxW, height:52, color:green});
  page.drawText(
    "Total Keseluruhan Pendapatan Bersih dikurangi Kuota API : " + rp(bersih),
    {x:margin+8, y:startY-60, size:14, font:fontBold, color:white});
  page.drawText(
    "(" + terbilangRupiah(bersih) + ".)",
    {x:margin+8, y:startY-80, size:13, font:font, color:white});

  const bytes = await pdfDoc.save();
  return bytes;
}

function getNamaFile(){
  let n = document.getElementById('namaFile').value.trim() || "hasil-edit.pdf";
  if(!n.toLowerCase().endsWith('.pdf')) n += ".pdf";
  return n;
}

function namaFileKemarin(){
  const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const d = new Date();
  d.setDate(d.getDate() - 1);
  const dd = String(d.getDate()).padStart(2, "0");
return "Laporan TRX FamsssPay " + dd + "-" + bulan[d.getMonth()] + "-" + d.getFullYear() + ".pdf";
}

document.getElementById('namaFile').value = namaFileKemarin();

document.getElementById('btnDownload').addEventListener('click', async function(){
  const status = document.getElementById('status');
  status.innerText = "Memproses...";
  const bytes = await editPdf();
  if(!bytes) return;
  const blob = new Blob([bytes], {type:"application/pdf"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = getNamaFile();
  a.click();
  URL.revokeObjectURL(url);
  status.innerText = "Selesai, PDF terunduh.";
});

document.getElementById('btnShare').addEventListener('click', async function(){
  const status = document.getElementById('status');
  status.innerText = "Memproses...";
  const bytes = await editPdf();
  if(!bytes) return;
  const file = new File([bytes], getNamaFile(), {type:"application/pdf"});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:getNamaFile()});
      status.innerText = "Silakan pilih Google Drive di menu share.";
    }catch(err){
      status.innerText = "Share dibatalkan.";
    }
  } else {
    const blob = new Blob([bytes], {type:"application/pdf"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = getNamaFile();
    a.click();
    URL.revokeObjectURL(url);
    window.open("https://drive.google.com/drive/my-drive", "_blank");
    status.innerText = "Browser tidak mendukung share langsung. File terunduh, silakan upload manual ke Google Drive yang baru dibuka.";
  }
});

hitung();
</script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let previewDoc = null;
let previewPageNum = 1;
let previewTotalPages = 0;

async function renderPreviewPage(num){
  if(!previewDoc) return;
  const page = await previewDoc.getPage(num);
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');
  const container = canvas.parentElement;
  const baseViewport = page.getViewport({scale:1});
  const targetWidth = container.clientWidth - 16;
  const scale = targetWidth > 0 ? targetWidth / baseViewport.width : 1;
  const viewport = page.getViewport({scale:scale});
  const outputScale = window.devicePixelRatio || 1;
  canvas.width = Math.floor(viewport.width * outputScale);
  canvas.height = Math.floor(viewport.height * outputScale);
  canvas.style.width = Math.floor(viewport.width) + "px";
  canvas.style.height = Math.floor(viewport.height) + "px";
  const transform = outputScale !== 1 ? [outputScale,0,0,outputScale,0,0] : null;
  await page.render({canvasContext: ctx, viewport: viewport, transform: transform}).promise;
  document.getElementById('pageInfo').innerText = "Halaman " + num + " dari " + previewTotalPages;
  document.getElementById('btnPrevPage').disabled = num <= 1;
  document.getElementById('btnNextPage').disabled = num >= previewTotalPages;
}

document.getElementById('pdfFile').addEventListener('change', function(e){
  const f = e.target.files[0];
  const previewCard = document.getElementById('pdfPreviewCard');
  if(!f){
    previewCard.style.display = "none";
    previewDoc = null;
    return;
  }
  const previewReader = new FileReader();
  previewReader.onload = async function(ev){
    const typedArray = new Uint8Array(ev.target.result);
    previewDoc = await pdfjsLib.getDocument({data: typedArray}).promise;
    previewTotalPages = previewDoc.numPages;
    previewPageNum = 1;
    previewCard.style.display = "block";
    renderPreviewPage(previewPageNum);
  };
  previewReader.readAsArrayBuffer(f);
});

document.getElementById('btnPrevPage').addEventListener('click', function(){
  if(previewPageNum > 1){
    previewPageNum--;
    renderPreviewPage(previewPageNum);
  }
});

document.getElementById('btnNextPage').addEventListener('click', function(){
  if(previewPageNum < previewTotalPages){
    previewPageNum++;
    renderPreviewPage(previewPageNum);
  }
});

document.getElementById('btnLihatHasil').addEventListener('click', async function(){
  const status = document.getElementById('status');
  status.innerText = "Memproses pratinjau hasil edit...";
  const bytes = await editPdf();
  if(!bytes) return;
  const typedArray = new Uint8Array(bytes);
  previewDoc = await pdfjsLib.getDocument({data: typedArray}).promise;
  previewTotalPages = previewDoc.numPages;
  previewPageNum = previewTotalPages;
  const previewCard = document.getElementById('pdfPreviewCard');
  previewCard.style.display = "block";
  await renderPreviewPage(previewPageNum);
  previewCard.scrollIntoView({behavior:"smooth", block:"center"});
  status.innerText = "Menampilkan pratinjau hasil edit.";
});

function autoResizeNamaFile(){
  const ta = document.getElementById('namaFile');
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}
document.getElementById('namaFile').addEventListener('input', autoResizeNamaFile);
window.addEventListener('load', autoResizeNamaFile);
</script>

</body>
</html>
