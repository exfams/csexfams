<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layanan Maintenance</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap" rel="stylesheet">
  <style>

    @import url('https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap');
    * 
    {
      box-sizing: border-box;
    }

    body {
      font-family: 'gabarito', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .content {
      text-align: center;
      max-width: 360px;
      width: 100%;
    }

    .content img {
      width: 280px;
      border-radius: 5%;
      margin-bottom: -20px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #333;
    }

    p {
      font-size: 15px;
      color: #777;
      margin-bottom: 25px;
    }

    .btn-remind {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      border: 2px solid #6495ED;
      background-color: #fff;
      color: #6495ED;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .btn-remind:hover {
      background-color: #6495ED;
      color: #fff;
    }

    .btn-remind svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .footer {
      border-top: 1px solid #e0e0e0;
      background-color: #f3f4f5;
      padding: 16px 20px;
      text-align: center;
    }

    .btn-close {
      display: block;
      width: 100%;
      background-color: #6495ED;
      color: #fff;
      padding: 14px 0;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .btn-close:hover {
      background-color: #2570fc;
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="content">
      <img src="https://fmgaming0.wordpress.com/wp-content/uploads/2025/11/unnamed-4.webp" alt="Ilustrasi" /><br><br>

      <h2>Fitur Dalam Pengembangan</h2>
      <p>Fitur Masih pengembangan update nih.<br>ditunggu Informasi selanjutnya dari MinFams!<br><br>aktifkan dulu Notifikasi aplikasi FamsssPay<br> untuk mengetahui informasi terbaru.</p>
    </div>
  </div>

 <div class="footer">
    <small>Keamanan Transaksi 100%<br>dengan enkripsi Exfams Cotery</small>
  </div>

</body>
</html>
