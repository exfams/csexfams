<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Pembekuan Akun</title>
  <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Gabarito', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      padding: 24px 16px 60px;
      color: #1a1a2e;
    }

    .topbar {
      background: linear-gradient(135deg, #2196f3, #1565c0);
      color: white;
      padding: 18px 24px;
      border-radius: 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(33,150,243,0.3);
    }

    .topbar i { font-size: 24px; }
    .topbar h1 { font-size: 18px; font-weight: 700; }
    .topbar p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #2196f3;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      margin-top: 14px;
    }

    label:first-of-type { margin-top: 0; }

    input[type="email"], textarea, select {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid #e0e7ff;
      border-radius: 10px;
      font-family: 'Gabarito', sans-serif;
      font-size: 14px;
      color: #1a1a2e;
      outline: none;
      transition: border 0.2s;
      background: #fafbff;
    }

    input[type="email"]:focus, textarea:focus {
      border-color: #2196f3;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .alasan-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .alasan-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alasan-item input[type="text"] {
      flex: 1;
      padding: 9px 12px;
      border: 2px solid #e0e7ff;
      border-radius: 8px;
      font-family: 'Gabarito', sans-serif;
      font-size: 13px;
      color: #1a1a2e;
      outline: none;
      background: #fafbff;
      transition: border 0.2s;
    }

    .alasan-item input[type="text"]:focus { border-color: #2196f3; background: white; }

    .btn-remove {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .btn-remove:hover { background: #fca5a5; }

    .btn-add-alasan {
      background: #e0f2fe;
      color: #0277bd;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Gabarito', sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-add-alasan:hover { background: #bae6fd; }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #2196f3, #1565c0);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Gabarito', sans-serif;
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(33,150,243,0.3);
    }

    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(33,150,243,0.4); }
    .btn-submit:disabled { background: #b0bec5; box-shadow: none; cursor: not-allowed; transform: none; }

    /* Tabel list */
    .search-box {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e0e7ff;
      border-radius: 10px;
      font-family: 'Gabarito', sans-serif;
      font-size: 14px;
      outline: none;
      margin-bottom: 14px;
      background: #fafbff;
      transition: border 0.2s;
    }

    .search-box:focus { border-color: #2196f3; background: white; }

    .user-card {
      border: 1.5px solid #e0e7ff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      background: #fafbff;
      transition: border 0.2s;
    }

    .user-card:hover { border-color: #2196f3; }

    .user-email {
      font-size: 14px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-email i { color: #2196f3; font-size: 13px; }

    .user-alasan {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .user-alasan span {
      display: block;
      padding: 2px 0;
    }

    .user-alasan span::before { content: "✕ "; color: #dc2626; font-weight: 700; }

    .user-actions {
      display: flex;
      gap: 8px;
    }

    .btn-edit, .btn-delete, .btn-unfreeze {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Gabarito', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .btn-edit { background: #e0f2fe; color: #0277bd; }
    .btn-edit:hover { background: #bae6fd; }
    .btn-delete { background: #fee2e2; color: #dc2626; }
    .btn-delete:hover { background: #fca5a5; }
    .btn-unfreeze { background: #dcfce7; color: #16a34a; }
    .btn-unfreeze:hover { background: #bbf7d0; }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: #9ca3af;
      font-size: 14px;
    }

    .empty-state i { font-size: 32px; display: block; margin-bottom: 8px; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a2e;
      color: white;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      transition: transform 0.3s ease;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: #16a34a; }
    .toast.error { background: #dc2626; }

    .badge-count {
      background: #2196f3;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: auto;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #6b7280;
      font-size: 14px;
    }

    .loading i { animation: spin 1s linear infinite; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="topbar">
  <i class="fas fa-lock"></i>
  <div>
    <h1>Dashboard Pembekuan Akun</h1>
    <p>Kelola alasan pembekuan per user</p>
  </div>
  <button onclick="loadData(true)" title="Refresh dari server"
    style="margin-left:auto;background:rgba(255,255,255,0.2);border:none;color:white;
    width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;">
    <i class="fas fa-sync-alt"></i>
  </button>
</div>

<!-- Form Tambah/Edit -->
<div class="card">
  <div class="card-title">
    <i class="fas fa-user-lock"></i>
    <span id="formTitle">Bekukan Akun User</span>
  </div>

  <label>Email User</label>
  <input type="email" id="inputEmail" placeholder="contoh: linda@gmail.com"/>

  <label>Alasan Pembekuan</label>
  <div class="alasan-list" id="alasanList">
    <div class="alasan-item">
      <input type="text" placeholder="Tulis alasan..."/>
      <button class="btn-remove" onclick="hapusAlasan(this)"><i class="fas fa-times"></i></button>
    </div>
  </div>
  <button class="btn-add-alasan" onclick="tambahAlasan()">
    <i class="fas fa-plus"></i> Tambah Alasan
  </button>

  <button class="btn-submit" id="btnSubmit" onclick="simpanUser()">
    <i class="fas fa-save"></i>
    <span id="btnSubmitText">Simpan & Bekukan</span>
  </button>

  <button class="btn-submit" id="btnBatal" onclick="resetForm()"
    style="display:none; background:linear-gradient(135deg,#6b7280,#4b5563); margin-top:8px; box-shadow:none;">
    <i class="fas fa-times"></i> Batal Edit
  </button>
</div>

<!-- List User Dibekukan -->
<div class="card">
  <div class="card-title">
    <i class="fas fa-list"></i>
    <span>Akun Dibekukan</span>
    <span class="badge-count" id="badgeCount">0</span>
  </div>

  <input class="search-box" type="text" id="searchBox" placeholder="🔍 Cari email..." oninput="renderList()"/>

  <div id="userList"><div class="loading"><i class="fas fa-spinner"></i> Memuat data...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const MASTER_KEY = '$2a$10$C6XnodkUXs7SkLtdAQTNm.wz2pSeLbIkWKzpDdsKTdQrOzxcVR6.2';
  const BIN_ID     = '6a39f8dbda38895dfeef24ab';
  const BASE_URL   = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

  let users = [];
  let editingEmail = null;

  const CACHE_KEY  = 'frozen_users_cache';
  const CACHE_TIME = 'frozen_users_cache_time';
  const CACHE_TTL = 1 * 1000; // 1 detik dalam ms

  /* ─── Cache helpers ─── */
  function getCache() {
    try {
      const time = parseInt(localStorage.getItem(CACHE_TIME) || '0');
      if (Date.now() - time > CACHE_TTL) return null; // expired
      const raw = localStorage.getItem(CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }

  function setCache(data) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      localStorage.setItem(CACHE_TIME, Date.now().toString());
    } catch {}
  }

  function clearCache() {
    try {
      localStorage.removeItem(CACHE_KEY);
      localStorage.removeItem(CACHE_TIME);
    } catch {}
  }

  /* ─── Load data (cache dulu, JSONBin kalau perlu) ─── */
  async function loadData(forceRefresh = false) {
    // Coba cache dulu
    if (!forceRefresh) {
      const cached = getCache();
      if (cached) {
        users = cached;
        renderList();
        showToast('Data dari cache ✓', '');
        return;
      }
    }

    // Fetch JSONBin (hanya kalau cache kosong/expired/force)
    try {
      const res  = await fetch(BASE_URL + '/latest', {
        headers: { 'X-Master-Key': MASTER_KEY }
      });
      const json = await res.json();
      users = json.record.users || [];
      setCache(users); // simpan ke cache
      renderList();
    } catch (e) {
      // Coba fallback ke cache walau expired
      const raw = localStorage.getItem(CACHE_KEY);
      if (raw) {
        users = JSON.parse(raw);
        renderList();
        showToast('Pakai cache lama (offline)', '');
      } else {
        showToast('Gagal memuat data. Cek BIN_ID.', 'error');
        document.getElementById('userList').innerHTML =
          '<div class="empty-state"><i class="fas fa-exclamation-circle"></i>Gagal memuat. Cek BIN_ID.</div>';
      }
    }
  }

  /* ─── Simpan ke JSONBin + update cache ─── */
  async function saveData() {
    const res = await fetch(BASE_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': MASTER_KEY
      },
      body: JSON.stringify({ users })
    });
    if (!res.ok) throw new Error('Gagal simpan');
    setCache(users); // update cache setelah simpan
  }

  /* ─── Render list ─── */
  function renderList() {
    const q    = document.getElementById('searchBox').value.toLowerCase();
    const list = document.getElementById('userList');
    const filtered = users.filter(u => u.email.toLowerCase().includes(q));

    document.getElementById('badgeCount').textContent = users.length;

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i>Tidak ada akun dibekukan.</div>';
      return;
    }

    list.innerHTML = filtered.map(u => `
      <div class="user-card">
        <div class="user-email"><i class="fas fa-envelope"></i>${u.email}</div>
        <div class="user-alasan">
          ${u.alasan.map(a => `<span>${a}</span>`).join('')}
        </div>
        <div class="user-actions">
          <button class="btn-edit"     onclick="editUser('${u.email}')"><i class="fas fa-pen"></i> Edit</button>
          <button class="btn-unfreeze" onclick="unfreezeUser('${u.email}')"><i class="fas fa-unlock"></i> Cairkan</button>
          <button class="btn-delete"   onclick="deleteUser('${u.email}')"><i class="fas fa-trash"></i> Hapus</button>
        </div>
      </div>
    `).join('');
  }

  /* ─── Tambah baris alasan ─── */
  function tambahAlasan() {
    const div = document.createElement('div');
    div.className = 'alasan-item';
    div.innerHTML = `
      <input type="text" placeholder="Tulis alasan..."/>
      <button class="btn-remove" onclick="hapusAlasan(this)"><i class="fas fa-times"></i></button>
    `;
    document.getElementById('alasanList').appendChild(div);
  }

  function hapusAlasan(btn) {
    const list = document.getElementById('alasanList');
    if (list.children.length > 1) btn.parentElement.remove();
  }

  /* ─── Simpan user ─── */
  async function simpanUser() {
    const email   = document.getElementById('inputEmail').value.trim().toLowerCase();
    const inputs  = document.querySelectorAll('#alasanList input');
    const alasan  = Array.from(inputs).map(i => i.value.trim()).filter(Boolean);

    if (!email) { showToast('Email tidak boleh kosong!', 'error'); return; }
    if (alasan.length === 0) { showToast('Minimal 1 alasan!', 'error'); return; }

    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

    try {
      if (editingEmail) {
        // Edit
        const idx = users.findIndex(u => u.email === editingEmail);
        if (idx !== -1) users[idx] = { email, alasan };
      } else {
        // Cek duplikat
        if (users.find(u => u.email === email)) {
          showToast('Email sudah ada! Gunakan Edit.', 'error');
          return;
        }
        users.push({ email, alasan });
      }

      await saveData();
      showToast(editingEmail ? 'Berhasil diupdate!' : 'Akun berhasil dibekukan!', 'success');
      resetForm();
      renderList();
    } catch {
      showToast('Gagal menyimpan!', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-save"></i> <span id="btnSubmitText">Simpan & Bekukan</span>';
    }
  }

  /* ─── Edit user ─── */
  function editUser(email) {
    const user = users.find(u => u.email === email);
    if (!user) return;

    editingEmail = email;
    document.getElementById('inputEmail').value = email;
    document.getElementById('inputEmail').readOnly = true;
    document.getElementById('formTitle').textContent = 'Edit Alasan Pembekuan';
    document.getElementById('btnSubmitText').textContent = 'Update';
    document.getElementById('btnBatal').style.display = 'flex';

    const list = document.getElementById('alasanList');
    list.innerHTML = '';
    user.alasan.forEach(a => {
      const div = document.createElement('div');
      div.className = 'alasan-item';
      div.innerHTML = `
        <input type="text" value="${a}" placeholder="Tulis alasan..."/>
        <button class="btn-remove" onclick="hapusAlasan(this)"><i class="fas fa-times"></i></button>
      `;
      list.appendChild(div);
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ─── Cairkan (hapus alasan, tetap ada tapi kosong) ─── */
  async function unfreezeUser(email) {
    if (!confirm(`Cairkan akun ${email}?`)) return;
    users = users.filter(u => u.email !== email);
    try {
      await saveData();
      showToast('Akun berhasil dicairkan!', 'success');
      renderList();
    } catch {
      showToast('Gagal mencairkan!', 'error');
    }
  }

  /* ─── Hapus permanen ─── */
  async function deleteUser(email) {
    if (!confirm(`Hapus permanen data ${email}?`)) return;
    users = users.filter(u => u.email !== email);
    try {
      await saveData();
      showToast('Data dihapus!', 'success');
      renderList();
    } catch {
      showToast('Gagal menghapus!', 'error');
    }
  }

  /* ─── Reset form ─── */
  function resetForm() {
    editingEmail = null;
    document.getElementById('inputEmail').value = '';
    document.getElementById('inputEmail').readOnly = false;
    document.getElementById('formTitle').textContent = 'Bekukan Akun User';
    document.getElementById('btnSubmitText').textContent = 'Simpan & Bekukan';
    document.getElementById('btnBatal').style.display = 'none';
    document.getElementById('alasanList').innerHTML = `
      <div class="alasan-item">
        <input type="text" placeholder="Tulis alasan..."/>
        <button class="btn-remove" onclick="hapusAlasan(this)"><i class="fas fa-times"></i></button>
      </div>
    `;
  }

  /* ─── Toast notif ─── */
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  loadData();
</script>
</body>
</html>
