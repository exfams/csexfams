<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Halaman Tidak Ditemukan - EXFAMS ID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue:       #2196f3;
      --blue-dark:  #2196f3;
      --blue-light: #eff6ff;
      --blue-mid:   #bfdbfe;
      --text:       #0f172a;
      --text-2:     #334155;
      --text-3:     #64748b;
      --border:     #e2e8f0;
      --white:      #ffffff;
      --page-bg:    #f8fafc;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--page-bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 15px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 24px;
      position: relative;
      overflow: hidden;
    }

    main::before,
    main::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: var(--blue-light);
      z-index: 0;
    }

    main::before { width: 420px; height: 420px; top: -140px; left: -120px; }
    main::after  { width: 320px; height: 320px; bottom: -120px; right: -80px; }

    .err-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(33,150,243,0.10);
    }

    .err-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
      background: var(--blue-light);
      border: 1px solid var(--blue-mid);
      padding: 5px 12px;
      border-radius: 100px;
      margin-bottom: 20px;
    }

    .err-badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--blue);
      animation: blink 2s infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .err-code {
      font-size: clamp(88px, 22vw, 140px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--blue);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .err-code .zero {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      animation: float 3s ease-in-out infinite;
    }

    .err-code .zero svg {
      width: 0.8em;
      height: 0.8em;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-8px); }
    }

    .err-title {
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text);
      margin-bottom: 12px;
    }

    .err-desc {
      font-size: 14px;
      color: var(--text-3);
      line-height: 1.7;
      max-width: 400px;
      margin: 0 auto 32px;
    }

    .err-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
      font-family: inherit;
      transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary { background: var(--blue); color: var(--white); }

    .btn-primary:hover {
      background: var(--blue-dark);
      box-shadow: 0 4px 14px rgba(33,150,243,0.35);
    }

    .btn-outline {
      background: var(--white);
      color: var(--text-2);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: var(--blue-light);
      border-color: var(--blue-mid);
      color: var(--blue);
    }

    .err-path {
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-3);
      background: var(--page-bg);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      word-break: break-all;
    }

    .err-path strong { color: var(--text-2); font-weight: 600; }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      background: var(--white);
    }

    .footer-inner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-logo { font-size: 14px; font-weight: 700; color: var(--blue); }
    .footer-copy { font-size: 12px; color: var(--text-3); }

    @media (max-width: 700px) {
      .err-card { padding: 36px 22px; border-radius: 20px; }
      .footer-inner { justify-content: center; text-align: center; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo" id="logoLink">EXFAMS ID</a>
  </div>
</nav>

<!-- MAIN -->
<main>
  <div class="err-card">
    <div class="err-badge">
      <span class="err-badge-dot"></span>
      Error 404
    </div>

    <div class="err-code">
      4
      <span class="zero">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </span>
      4
    </div>

    <h1 class="err-title">Halaman Tidak Ditemukan</h1>
    <p class="err-desc">
      Maaf, halaman yang Anda cari tidak tersedia, sudah dipindahkan, atau alamat yang dimasukkan kurang tepat.
    </p>

    <div class="err-actions">
      <a href="https://exfams.web.id" class="btn btn-primary" id="homeLink">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Kembali ke Beranda
      </a>
      <a href="https://wa.me/6289502338374" class="btn btn-outline">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/></svg>
        Hubungi via WhatsApp
      </a>
    </div>


  </div>
</main>

<!-- FOOTER -->
<footer>
  <div class="footer-inner">
    <div class="footer-logo">EXFAMS ID</div>
    <div class="footer-copy">© 2019 - 2026 Semua hak dilindungi.</div>
  </div>
</footer>

<script>
  // Tampilkan alamat yang diminta
  document.getElementById('reqPath').textContent = location.pathname + location.search;

  // Sesuaikan link beranda (aman untuk github.io/nama-repo maupun domain sendiri)
  (function() {
    var base = '/';
    if (location.hostname.endsWith('github.io')) {
      var seg = location.pathname.split('/')[1];
      if (seg && !seg.endsWith('.html')) base = '/' + seg + '/';
    }
    document.getElementById('homeLink').href = base;
    document.getElementById('logoLink').href = base;
  })();
</script>

</body>
</html>
