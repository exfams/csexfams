<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Admin Absensi</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
/* =========================================================
   1. VARIABEL (ubah warna / gradasi / bayangan di sini saja)
========================================================= */
:root{
  /* Warna dasar */
  --blue:#2196f3;
  --blue-dark:#1769aa;
  --ink:#16324a;
  --muted:#6b7f90;
  --line:#dbe7f1;
  --bg:#f2f7fc;
  --red:#e5484d;
  --green:#2e9e4f;

  /* Warna border */
  --border-1:#8fb4d6;
  --border-2:#7da2c4;
  --border-3:#9bbbd8;

  /* Warna flat */
  --g-bg:#eaf4fc;
  --g-hero:#2196f3;
  --g-panel:#ffffff;
  --g-card:#ffffff;
  --g-stat:#f2f7fc;
  --g-popup:#ffffff;
  --g-row-mobile:#ffffff;
  --g-blue:#2196f3;
  --g-light:#f2f7fc;
  --g-light-hover:#e3f2fd;
  --g-thead-title:#2196f3;
  --g-thead-col:#64b5f6;
  --g-red:#e5484d;
  --g-green:#2e9e4f;

  /* Bayangan */
  --sh-btn:none;
  --sh-btn-blue:none;
  --sh-card:0 1px 4px rgba(0,0,0,.1);
  --sh-panel:0 1px 4px rgba(0,0,0,.1);
  --sh-box:0 1px 4px rgba(0,0,0,.1);
  --sh-input:none;
  --sh-thead:none;

  /* Bayangan teks */
  --ts-blue:none;
}

/* =========================================================
   2. DASAR
========================================================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--g-bg) fixed;
  color:var(--ink);
  font-family:'Segoe UI',Roboto,Arial,sans-serif;
  min-height:100vh;
}
.wrap{max-width:1000px;margin:0 auto;padding:12px 12px 30px;}

/* =========================================================
   3. HEADER
========================================================= */
.hero{
  background:var(--g-hero);
  color:#fff;
  padding:14px 16px;
  border-bottom:1px solid var(--blue-dark);
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.hero-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.logo{width:42px;height:42px;border-radius:10px;background:#fff;padding:4px;object-fit:contain;flex-shrink:0;}
.brand h1{font-size:16px;margin:0;line-height:1.2;}
.brand small{display:block;font-size:12px;opacity:.9;margin-top:2px;}
.clock{text-align:right;flex-shrink:0;}
.clock b{display:block;font-size:20px;font-variant-numeric:tabular-nums;}
.clock span{font-size:11.5px;opacity:.95;}

/* =========================================================
   4. PANEL, TAB, FILTER, INFO
========================================================= */
.panel{
  background:var(--g-panel);
  border:1px solid var(--border-1);
  border-radius:8px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:var(--sh-panel);
}

/* Tab */
.tabs{display:flex;gap:6px;margin-bottom:10px;}
.tab{
  flex:1;
  padding:10px 8px;
  border:1px solid var(--border-2);
  border-radius:6px;
  background:var(--g-light);
  font-size:13px;
  font-weight:700;
  font-family:inherit;
  color:#1a4f80;
  cursor:pointer;
  box-shadow:var(--sh-btn);
}
.tab:hover{background:var(--g-light-hover);border-color:#3c9ad8;}
.tab.active{
  background:var(--blue);
  border-color:var(--blue-dark);
  color:#fff;
}

/* Filter */
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.bar input,.bar select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border-1);
  border-top-color:#6d93b8;
  border-radius:5px;
  font-size:14px;
  font-family:inherit;
  background:#fff;
  color:var(--ink);
  box-shadow:var(--sh-input);
}
.bar input:focus,.bar select:focus{outline:2px solid var(--blue);outline-offset:0;}
.bar input[type=text]{grid-column:1 / -1;}

/* Info status */
.info{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);}
.info b{background:#e3f2fd;color:var(--blue-dark);padding:3px 10px;border-radius:20px;font-size:13px;}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px;}
.dot.on{background:var(--green);}

/* =========================================================
   5. TABEL
========================================================= */
.box{
  background:#fff;
  border:1px solid var(--border-2);
  border-radius:8px;
  overflow:hidden;
  box-shadow:var(--sh-box);
}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{padding:11px 14px;text-align:center;border:1px solid #e0e0e0;white-space:nowrap;color:#000;}

/* Judul tabel */
thead tr.judul-tabel th{
  background:var(--g-thead-title);
  color:#fff;
  font-size:15px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.02em;
  border:1px solid var(--blue-dark);
  padding:12px;
}
/* Nama kolom */
thead tr.kolom th{
  background:var(--g-thead-col);
  color:#fff;
  font-size:14px;
  font-weight:700;
  text-transform:none;
  letter-spacing:0;
  border:1px solid #42a5f5;
}

/* Baris */
tbody tr:nth-child(odd){background:#fafafa;}
tbody tr:nth-child(even){background:#fff;}
tbody tr:hover{background:#f1f9ff;}
td.link{max-width:260px;overflow:hidden;text-overflow:ellipsis;}
td a{color:var(--blue-dark);font-weight:600;text-decoration:none;}
.kosong{padding:28px 16px;text-align:center;color:var(--muted);}
.sisa{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px;}

/* =========================================================
   6. TOMBOL
========================================================= */
/* Hapus & Pulihkan */
.btn-hapus,.btn-pulih{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  color:#fff;
  font-size:12.5px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
}
.btn-hapus{
  background:var(--red);
  border:none;
}
.btn-pulih{
  background:var(--green);
  border:none;
  margin-right:6px;
}
.btn-hapus:active,.btn-pulih:active{opacity:.8;}
.btn-hapus:disabled,.btn-pulih:disabled{opacity:.5;cursor:not-allowed;}

/* Riwayat views */
.btn-riwayat-views{
  padding:8px 14px;
  border:1px solid var(--border-2);
  border-radius:6px;
  background:var(--g-light);
  color:#1a4f80;
  font-size:12.5px;
  font-weight:700;
  font-family:inherit;
  margin-right:6px;
  cursor:pointer;
  box-shadow:var(--sh-btn);
}
.btn-riwayat-views:active{box-shadow:inset 0 2px 4px rgba(0,50,100,.35);}

/* =========================================================
   7. VIEWS TIKTOK
========================================================= */
.views-bar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--line);
  font-size:12px;
  color:var(--muted);
}
.views-btns{display:flex;gap:6px;flex-shrink:0;}
.btn-views{
  padding:8px 12px;
  border:1px solid var(--blue-dark);
  border-radius:6px;
  background:var(--g-blue);
  color:#fff;
  font-size:12.5px;
  font-weight:700;
  font-family:inherit;
  flex-shrink:0;
  cursor:pointer;
  text-shadow:var(--ts-blue);
  box-shadow:var(--sh-btn-blue);
}
.btn-views:hover:not(:disabled){filter:brightness(1.1);}
.btn-views:active:not(:disabled){box-shadow:inset 0 2px 4px rgba(0,40,90,.5);}
.btn-views:disabled{opacity:.5;cursor:not-allowed;}

/* Angka views di tabel */
.v-angka{display:block;font-weight:800;font-size:14px;}
.v-info{display:block;font-size:11px;font-weight:700;margin-top:2px;}
.v-naik{color:var(--green);}
.v-tetap{color:var(--red);}
.v-baru{color:var(--muted);font-weight:400;}

/* =========================================================
   8. LAPORAN VIEWS
========================================================= */
.rk{
  background:var(--g-card);
  border:1px solid var(--border-2);
  border-radius:8px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:var(--sh-card);
}
.rk h4{margin:0 0 10px;font-size:15px;color:var(--blue-dark);}

/* Kotak statistik */
.rk-stat{display:flex;gap:8px;margin-bottom:6px;}
.rk-stat div{
  flex:1;
  background:var(--g-stat);
  border:1px solid var(--border-3);
  border-radius:6px;
  padding:8px 4px;
  text-align:center;
  box-shadow:var(--sh-btn);
}
.rk-stat b{display:block;font-size:20px;}
.rk-stat span{font-size:11px;color:var(--muted);}

/* Judul kategori */
.rk-judul{margin:12px 0 2px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:6px;display:inline-block;color:#fff;}
.rk-judul.k1{background:var(--green);}
.rk-judul.k5{background:var(--blue);}

/* Daftar video */
.rk-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed #e3edf5;font-size:12.5px;}
.rk-item:last-child{border-bottom:none;}
.rk-item a{display:block;color:var(--blue-dark);font-weight:600;text-decoration:none;word-break:break-all;margin-top:2px;}
.rk-v{font-weight:800;font-size:14px;flex-shrink:0;}
.rk-kosong{font-size:12.5px;color:var(--muted);padding-top:8px;}

/* Semua video (dropdown) */
.rk-semua{margin-top:12px;border-top:1px solid var(--line);padding-top:6px;}
.rk-semua summary{cursor:pointer;font-size:12.5px;font-weight:800;color:var(--blue-dark);padding:8px 0;}

/* Thumbnail */
.thumb{
  display:flex;
  align-items:center;
  justify-content:center;
  width:72px;
  height:96px;
  flex-shrink:0;
  border-radius:8px;
  overflow:hidden;
  background:var(--line);
  border:1px solid var(--border-3);
  text-decoration:none;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb-ket{font-size:10.5px;color:var(--muted);font-weight:400;text-align:center;padding:4px;word-break:normal;}

/* Badge 100+ / 500+ / 1K+ */
.badge-v{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:10px;font-size:10.5px;font-weight:800;color:#fff;vertical-align:middle;}
.badge-v.b3{background:var(--green);}
.badge-v.b2{background:var(--blue);}
.badge-v.b1{background:#f59e0b;}

/* =========================================================
   9. POPUP & TOAST
========================================================= */
.pop{position:fixed;inset:0;background:rgba(10,30,50,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:999;}
.pop.show{display:flex;}
.pop-box{
  background:var(--g-popup);
  border:1px solid #5f8db8;
  border-radius:10px;
  padding:22px 18px 16px;
  width:100%;
  max-width:360px;
  max-height:90vh;
  overflow-y:auto;
  text-align:center;
  box-shadow:inset 0 1px 0 #fff,0 10px 30px rgba(0,30,70,.55);
}
.pop-ic{width:50px;height:50px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;background:var(--blue);}
.pop-ic.bahaya{background:var(--red);}
.pop-ic.sukses{background:var(--green);}
.pop-box h3{margin:0 0 6px;font-size:17px;}
.pop-pesan{font-size:13px;color:var(--muted);margin-bottom:12px;}
.pop-rows{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:left;font-size:12.5px;margin-bottom:14px;}
.pop-rows div{display:flex;gap:8px;padding:3px 0;}
.pop-rows span{color:var(--muted);min-width:48px;flex-shrink:0;}
.pop-rows b{word-break:break-all;font-weight:600;}
.pop-aksi{display:flex;gap:8px;}
.pop-aksi button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}
.pb-batal{background:#e6eef6;color:var(--muted);}
.pb-ok{background:var(--blue);color:#fff;}
.pb-ok.merah{background:var(--red);}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:var(--ink);
  color:#fff;
  padding:11px 18px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  max-width:90%;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s;
  z-index:1000;
}
.toast.show{opacity:1;}

/* =========================================================
   10. MOBILE (baris tabel jadi kartu ringkas)
========================================================= */
@media (max-width:720px){
  /* Header */
  .hero{padding:10px 12px;}
  .logo{width:36px;height:36px;}
  .brand h1{font-size:14px;}
  .brand small{font-size:11px;}
  .clock b{font-size:16px;}
  .clock span{font-size:10.5px;}

  /* Konten */
  .wrap{padding:10px 10px 24px;}
  .panel{padding:10px;margin-bottom:10px;}
  .box{background:transparent;border:none;border-radius:0;overflow:visible;}

  /* Tabel -> kartu */
  table,thead,tbody,tr,td{display:block;width:100%;}
  thead{display:none;}
  tbody tr,
  tbody tr:nth-child(odd),
  tbody tr:nth-child(even),
  tbody tr:hover{background:var(--g-row-mobile);}
  tbody tr{
    border:1px solid var(--border-2);
    border-top:3px solid var(--blue);
    border-radius:8px;
    padding:4px 12px;
    margin-bottom:12px;
    box-shadow:0 1px 4px rgba(0,0,0,.1);
  }
  td{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:6px 0;
    border:none;
    border-bottom:1px dashed #e3edf5;
    white-space:normal;
    text-align:right;
    font-size:13px;
  }
  td::before{
    content:attr(data-label);
    font-size:10.5px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    text-align:left;
    flex-shrink:0;
    padding-top:2px;
  }
  td[data-label="No"]{display:none;}
  td.link{max-width:none;word-break:break-all;overflow:visible;text-overflow:clip;}
  td.aksi{border-bottom:none;justify-content:flex-end;gap:8px;padding:8px 0 6px;}
  td.aksi::before{display:none;}
  td.aksi button{flex:1;margin:0;padding:10px;}
  td.kosong{display:block;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px 16px;}
  td.kosong::before{display:none;}
  .sisa{text-align:right;}
}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-in">
    <div class="brand">
      <img class="logo" src="https://fmgaming0.wordpress.com/wp-content/uploads/2025/11/logo-fm.webp" alt="FM" onerror="this.style.display='none'">
      <div>
        <h1>Dashboard Absensi</h1>
        <small>Exfams Jurnal</small>
      </div>
    </div>
    <div class="clock"><b id="jam">--:--:--</b><span id="tgl"></span></div>
  </div>
</div>

<div class="wrap">

  <div class="panel">
    <div class="tabs">
      <button type="button" class="tab active" id="tab-absensi" onclick="gantiTab('absensi')">Absensi</button>
      <button type="button" class="tab" id="tab-hapus" onclick="gantiTab('hapus')">Riwayat Hapus</button>
      <button type="button" class="tab" id="tab-laporan" onclick="gantiTab('laporan')">Laporan Views</button>
    </div>

    <div class="bar">
      <input type="date" id="f-tanggal">
      <input type="month" id="f-bulan" style="display:none;grid-column:1 / -1;">
      <select id="f-mode">
        <option value="tanggal">Per tanggal</option>
        <option value="semua">Semua tanggal</option>
      </select>
      <input type="text" id="f-cari" placeholder="Cari nama / akun...">
    </div>

    <div class="info">
      <div><span class="dot" id="dot"></span><span id="status">Menghubungkan...</span></div>
      <div>Total: <b id="total">0</b></div>
    </div>

    <div class="views-bar" id="views-bar">
      <span id="views-status">Klik tombol untuk cek views</span>
      <div class="views-btns">
        <button type="button" class="btn-views" id="btn-views-hari" onclick="cekSemuaViews('hari')">Cek Hari Ini</button>
        <button type="button" class="btn-views" id="btn-views-bulan" onclick="cekSemuaViews('bulan')">Cek Bulan Ini</button>
      </div>
    </div>
  </div>

  <div class="box" id="box-absensi">
    <table>
      <thead>
        <tr class="judul-tabel"><th colspan="8">DATA ABSENSI</th></tr>
        <tr class="kolom"><th>No</th><th>Tanggal</th><th>Jam Kirim</th><th>Nama</th><th>Akun</th><th>Link</th><th>Views</th><th>Aksi</th></tr>
      </thead>
      <tbody id="isi"></tbody>
    </table>
  </div>

  <div class="box" id="box-hapus" style="display:none;">
    <table>
      <thead>
        <tr class="judul-tabel"><th colspan="7">RIWAYAT HAPUS</th></tr>
        <tr class="kolom"><th>No</th><th>Dihapus Pada</th><th>Nama</th><th>Akun</th><th>Link</th><th>Waktu Kirim Asli</th><th>Aksi</th></tr>
      </thead>
      <tbody id="isi-hapus"></tbody>
    </table>
  </div>

  <div id="box-laporan" style="display:none;">
    <div id="laporan-list"></div>
  </div>

</div>

<!-- Popup & notifikasi -->
<div class="pop" id="pop">
  <div class="pop-box">
    <div class="pop-ic" id="pop-ic">?</div>
    <h3 id="pop-judul"></h3>
    <div class="pop-pesan" id="pop-pesan"></div>
    <div class="pop-rows" id="pop-rows"></div>
    <div class="pop-aksi">
      <button type="button" class="pb-batal" id="pop-batal">Batal</button>
      <button type="button" class="pb-ok" id="pop-ok">Ya</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA9PKKQblLdzBNW-wO9pPHij9C7VRa7izI",
  authDomain: "absen-ky-fm.firebaseapp.com",
  databaseURL: "https://absen-ky-fm-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-ky-fm",
  storageBucket: "absen-ky-fm.firebasestorage.app",
  messagingSenderId: "660563083464",
  appId: "1:660563083464:web:84d5f8fea4cec588ba25fd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const p2 = n => String(n).padStart(2, '0');
let semuaData = [];

function hariIniISO(){
  const d = new Date();
  return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
}
function formatTanggal(iso){
  if(!iso || String(iso).split('-').length !== 3) return '-';
  const [y, m, d] = String(iso).split('-');
  return `${parseInt(d)} ${BULAN[parseInt(m) - 1]} ${y}`;
}
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ===== Popup & notifikasi (pengganti alert/confirm) ===== */
function bukaPopup(opt){
  return new Promise(resolve => {
    const pop = document.getElementById('pop');
    const ic = document.getElementById('pop-ic');
    const btnOk = document.getElementById('pop-ok');
    const btnBatal = document.getElementById('pop-batal');
    const rowsEl = document.getElementById('pop-rows');
    const tipe = opt.tipe || 'info';

    ic.className = 'pop-ic ' + tipe;
    ic.textContent = tipe === 'bahaya' ? '!' : (tipe === 'sukses' ? '✓' : '?');
    document.getElementById('pop-judul').textContent = opt.judul || '';
    document.getElementById('pop-pesan').textContent = opt.pesan || '';
    document.getElementById('pop-pesan').style.display = opt.pesan ? '' : 'none';

    if(opt.rows && opt.rows.length){
      rowsEl.innerHTML = opt.rows.map(x => `<div><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('');
      rowsEl.style.display = '';
    }else{
      rowsEl.style.display = 'none';
    }

    btnOk.textContent = opt.ok || 'Ya';
    btnOk.className = 'pb-ok' + (opt.merah ? ' merah' : '');
    btnBatal.style.display = opt.batal === false ? 'none' : '';

    const tutup = hasil => {
      pop.classList.remove('show');
      btnOk.onclick = null; btnBatal.onclick = null; pop.onclick = null;
      resolve(hasil);
    };
    btnOk.onclick = () => tutup(true);
    btnBatal.onclick = () => tutup(false);
    pop.onclick = e => { if(e.target === pop) tutup(false); };
    pop.classList.add('show');
  });
}

async function hapusAbsen(key, tombol){

  );
  if(!yakin) return;

  tombol.disabled = true;
  const d = new Date();
  const logKey = db.ref('riwayat_hapus').push().key;
  const upd = {};

  Object.keys(viewsData).forEach(vk => {
    if(vk.indexOf(key + '~') === 0) upd['views/' + vk] = null;
  });
  upd['riwayat_hapus/' + logKey] = {

  };

  }

  }
  toast('Absensi dihapus, tercatat di Riwayat Hapus');

/* Hapus link & status selesai di state karyawan supaya form-nya bisa diisi ulang */
function bukaKunciKaryawan(r){
  const [y, m, d] = String(r.tanggal).split('-');
  const bulanKey = `absen-${y}-${m}`;
  const hari = parseInt(d);

  return db.ref('state/' + kunciNama(r.nama)).transaction(cur => {
    if(typeof cur !== 'string' || !cur.startsWith(MARKER)) return cur;
    let obj;
    try{ obj = JSON.parse(cur.slice(MARKER.length)); }catch(err){ return cur; }

    if(obj.month === bulanKey && obj.data && obj.data[String(hari)]){
      const e = obj.data[String(hari)];
      if(e.links) delete e.links[r.nomor];
      e.posting = false;
      delete e.posting_waktu;
      e.t = Date.now();
    }else if(obj.hist && Array.isArray(obj.hist[bulanKey])){
      obj.hist[bulanKey] = obj.hist[bulanKey].filter(x => x !== hari);
    }
    return MARKER + JSON.stringify(obj);
  });
}

/* =========================================================
   DETEKSI VIEWS TIKTOK
   Data views tiap link disimpan per jam di: views/<kunci absensi>/<timestamp>
========================================================= */
const PARALEL_VIEWS = 5;                  // jumlah link dicek bersamaan lewat Worker (API Clair)
const SIMPAN_HEARTBEAT_MS = 30 * 60 * 1000; // views tidak berubah tetap dicatat tiap 30 menit

/* Waktu pengecekan terakhir satu link (dari _meta.cek atau snapshot terakhir) */
function terakhirCek(vk){
  const o = viewsData[vk];
  const s = snapUrut(vk);
  const t1 = s.length ? s[s.length - 1].ts : 0;
  const t2 = (o && o._meta && o._meta.cek) ? Number(o._meta.cek) : 0;
  return Math.max(t1, t2);
}
let viewsData = {};
let sedangCekViews = false;
let viewsAwalJalan = false;
let timerRender = null;

function renderTunda(){
  clearTimeout(timerRender);
  timerRender = setTimeout(render, 150);
}
function tunggu(ms){ return new Promise(r => setTimeout(r, ms)); }
function fmtAngka(n){ return Number(n || 0).toLocaleString('id-ID'); }
function fmtJamTs(ts){
  const d = new Date(ts);
  return `${p2(d.getDate())}/${p2(d.getMonth() + 1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

/* Daftar snapshot views satu link, urut dari lama ke baru */
function hashLink(s){
  let h = 5381;
  const t = String(s || '');
  for(let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
/* Kunci views = kunci absensi + sidik link, jadi kalau link diganti data views link lama tetap tersimpan */
function kunciViews(r){ return r._key + '~' + hashLink(r.link); }

function snapUrut(vk){
  const o = viewsData[vk];
  if(!o) return [];
  return Object.keys(o).filter(k => /^\d+$/.test(k)).map(k => Object.assign({ ts: Number(k) }, o[k])).sort((a, b) => a.ts - b.ts);
}

/* Tampilan views di tabel: angka terakhir + naik/tidak naik dibanding pengecekan sebelumnya */
function htmlViews(r){
  const vk = kunciViews(r);
  const s = snapUrut(vk);
  if(!s.length) return '<span class="v-info v-baru">Belum dicek</span>';
  const a = s[s.length - 1];
  const b = s[s.length - 2];
  let info;
  if(!b){
    info = '<span class="v-info v-baru">Pengecekan pertama</span>';
  }else{
    const d = a.v - b.v;
    if(d > 0) info = `<span class="v-info v-naik">▲ +${fmtAngka(d)}</span>`;
    else if(d < 0) info = `<span class="v-info v-tetap">▼ ${fmtAngka(d)}</span>`;
    else info = '<span class="v-info v-tetap">Tidak naik</span>';
  }
  return `<span class="v-angka">${fmtAngka(a.v)}</span>${info}<span class="v-info v-baru">dicek ${fmtJamTs(terakhirCek(vk))}</span>`;
}

/* Ambil statistik video lewat Cloudflare Worker (API clair.im) */
const WORKER_URL = 'https://acikiwir-piews-tt.famssspay.workers.dev'; // ganti dengan alamat Worker kamu

async function fetchJson(u, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try{
    const res = await fetch(u, { signal: ctrl.signal });
    if(!res.ok) return null;
    return await res.json();
  }catch(err){
    return null;
  }finally{
    clearTimeout(timer);
  }
}

async function ambilViewsTikTok(url){
  for(let i = 0; i < 2; i++){
    const j = await fetchJson(`${WORKER_URL}/?url=${encodeURIComponent(url)}`, 45000);
    if(j && j.ok){
      return {
        v: Number(j.v) || 0,
        l: Number(j.l) || 0,
        c: Number(j.c) || 0,
        s: Number(j.s) || 0
      };
    }
    await tunggu(1000);
  }
  return null;
}

/* Link yang dicek: mode 'hari' = tanggal hari ini, mode 'bulan' = semua tanggal di bulan ini */
function targetViews(mode){
  const hariIni = hariIniISO();
  const bulanIni = hariIni.slice(0, 7);
  return semuaData.filter(r => {
    if(!r.link || !/tiktok\.com/i.test(r.link)) return false;
    if(mode === 'bulan') return String(r.tanggal || '').slice(0, 7) === bulanIni;
    return r.tanggal === hariIni;
  });
}

/* Cek views link TikTok. mode: 'hari' = hari ini, 'bulan' = bulan ini. Hanya jalan lewat tombol */
async function cekSemuaViews(mode){
  const btnHari = document.getElementById('btn-views-hari');
  const btnBulan = document.getElementById('btn-views-bulan');
  const statusEl = document.getElementById('views-status');
  if(sedangCekViews){
    toast('Pengecekan views masih berjalan');
    return;
  }
  const label = mode === 'bulan' ? 'bulan ini' : 'hari ini';
  const daftar = targetViews(mode);
  if(!daftar.length){
    toast('Tidak ada link TikTok ' + label);
    return;
  }

  sedangCekViews = true;
  btnHari.disabled = true;
  btnBulan.disabled = true;
  let ok = 0, selesai = 0;
  let gagalList = [];

  /* Proses satu link: true = tersimpan, false = gagal, null = link sudah dihapus (dilewati) */
  const proses = async r => {
    const hasil = await ambilViewsTikTok(r.link);
    const masihAda = semuaData.some(x => x._key === r._key && x.link === r.link);
    if(!masihAda) return null;

    const vk = kunciViews(r);
    const s = snapUrut(vk);
    const akhir = s.length ? s[s.length - 1] : null;

    /* Views 0 padahal sebelumnya ada isinya = data tidak valid, views sebelumnya dipertahankan */
    if(!hasil || (hasil.v === 0 && akhir && akhir.v > 0)) return false;

    try{
      const waktu = Date.now();
      const upd = {};
      upd[`views/${vk}/_meta`] = {
        nama: r.nama || '-', akun: r.akun || '-', link: r.link,
        tanggal: r.tanggal, nomor: r.nomor || 0, cek: waktu
      };
      /* Snapshot disimpan kalau views berubah atau sudah 30 menit sejak snapshot terakhir */
      if(!akhir || hasil.v !== akhir.v || waktu - akhir.ts >= SIMPAN_HEARTBEAT_MS){
        upd[`views/${vk}/${waktu}`] = hasil;
      }
      await db.ref().update(upd);
      return true;
    }catch(err){
      return false;
    }
  };

  /* Jalankan daftar link dengan beberapa pekerja sekaligus */
  const jalankan = async (list, paralel, teksAwal, kumpulGagal) => {
    let idx = 0, n = 0;
    const kerja = async () => {
      while(idx < list.length){
        const r = list[idx++];
        const sukses = await proses(r);
        n++;
        if(sukses === true) ok++;
        else if(sukses === false && kumpulGagal) kumpulGagal.push(r);
        statusEl.textContent = `${teksAwal} ${n}/${list.length}...`;
      }
    };
    await Promise.all(Array.from({ length: Math.min(paralel, list.length) }, kerja));
  };

  statusEl.textContent = `Mengecek views ${label}: 0/${daftar.length}...`;
  await jalankan(daftar, PARALEL_VIEWS, `Mengecek views ${label}:`, gagalList);

  /* Ulang otomatis untuk link yang gagal */
  let gagal = gagalList.length;
  if(gagalList.length){
    const ulang = gagalList.slice();
    const sisa = [];
    await tunggu(1500);
    await jalankan(ulang, 2, 'Mengulang yang gagal:', sisa);
    gagal = sisa.length;
  }

  sedangCekViews = false;
  btnHari.disabled = false;
  btnBulan.disabled = false;
  statusEl.textContent = `Terakhir dicek ${fmtJamTs(Date.now())} (${label}) · berhasil ${ok}/${daftar.length}${gagal ? ', gagal ' + gagal : ''}`;
  toast(gagal ? `Views ${label}: berhasil ${ok}, gagal ${gagal}` : `Views ${label}: ${ok} link diperbarui`);
}

/* Popup riwayat views per jam satu link */
function lihatRiwayatViews(key){
  const r = semuaData.find(x => x._key === key);
  if(!r) return;
  const s = snapUrut(kunciViews(r));
  if(!s.length){
    bukaPopup({ judul: 'Belum ada data views', pesan: 'Klik tombol Cek Views untuk mengambil data.', ok: 'Tutup', batal: false, tipe: 'info' });
    return;
  }
  const rows = s.map((x, i) => {
    const d = i > 0 ? x.v - s[i - 1].v : null;
    const ket = d === null ? ' (awal)' : (d > 0 ? ` (+${fmtAngka(d)})` : (d === 0 ? ' (tidak naik)' : ` (${fmtAngka(d)})`));
    return [fmtJamTs(x.ts), `${fmtAngka(x.v)} views${ket}`];
  }).reverse().slice(0, 30);
  bukaPopup({ judul: 'Riwayat Views', pesan: `${r.nama} · ${r.akun}`, rows: rows, ok: 'Tutup', batal: false, tipe: 'sukses' });
}

/* ===== Laporan bulanan: video yang tembus 500 dan 1K+ views per akun ===== */
const BATAS_500 = 500;
const BATAS_1K = 1000;

function dataLaporan(bulan, cari){
  const hasil = {};
  semuaData.forEach(r => {
    if(!r.link || !/tiktok\.com/i.test(r.link)) return;
    if(String(r.tanggal || '').slice(0, 7) !== bulan) return;
    if(cari && !((r.nama || '') + ' ' + (r.akun || '')).toLowerCase().includes(cari)) return;
    const s = snapUrut(kunciViews(r));
    const akun = r.akun || '-';
    if(!hasil[akun]) hasil[akun] = [];
    hasil[akun].push({
      nama: r.nama || '-',
      tanggal: r.tanggal,
      link: r.link || '-',
      dicek: s.length > 0,
      views: s.length ? Math.max.apply(null, s.map(x => x.v)) : 0
    });
  });
  return hasil;
}

/* Ambil id video dari link TikTok (untuk preview) */
function idDariLink(link){
  const m = String(link || '').match(/\/(?:video|photo)\/(\d+)/);
  return m ? m[1] : '';
}

function renderLaporan(){
  const bulan = document.getElementById('f-bulan').value || hariIniISO().slice(0, 7);
  const cari = document.getElementById('f-cari').value.trim().toLowerCase();
  const data = dataLaporan(bulan, cari);
  const akunList = Object.keys(data).sort();
  const el = document.getElementById('laporan-list');

  if(!akunList.length){
    el.innerHTML = '<div class="kosong rk">Belum ada video TikTok untuk bulan ini.</div>';
    return 0;
  }

  let totalLolos = 0;
  el.innerHTML = akunList.map(akun => {
    const arr = data[akun].slice().sort((a, b) => b.views - a.views);
    const k1 = arr.filter(x => x.views >= BATAS_1K);
    const k5 = arr.filter(x => x.views >= BATAS_500 && x.views < BATAS_1K);
    const tingkat = v => v >= BATAS_1K ? 3 : (v >= BATAS_500 ? 2 : (v >= 100 ? 1 : 0));
    const semua = data[akun].slice().sort((a, b) => {
      if(b.views !== a.views) return b.views - a.views;
      return String(b.tanggal).localeCompare(String(a.tanggal));
    });
    totalLolos += k1.length + k5.length;
    const item = x =>
      `<div class="rk-item">
        <div><b>${esc(x.nama)}</b><span class="sisa">${esc(formatTanggal(x.tanggal))}</span><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.link)}</a></div>
        <div class="rk-v">${fmtAngka(x.views)}</div>
      </div>`;
    const itemSemua = x =>
      `<div class="rk-item">
        <a class="thumb" href="${esc(x.link)}" target="_blank" rel="noopener" data-link="${esc(x.link)}">${isiThumb(x.link)}</a>
        <div style="min-width:0;flex:1;"><b>${esc(x.nama)}</b>${tingkat(x.views) ? `<span class="badge-v b${tingkat(x.views)}">${tingkat(x.views) === 3 ? '1K+' : (tingkat(x.views) === 2 ? '500+' : '100+')}</span>` : ''}<span class="sisa">${esc(formatTanggal(x.tanggal))}</span><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.link)}</a></div>
        <div class="rk-v">${x.dicek ? fmtAngka(x.views) : '-'}</div>
      </div>`;
    return `<div class="rk">
      <h4>${esc(akun)}</h4>
      <div class="rk-stat">
        <div><b>${arr.length}</b><span>Total video</span></div>
        <div><b>${k5.length}</b><span>500 - 999</span></div>
        <div><b>${k1.length}</b><span>1K+</span></div>
      </div>
      ${k1.length ? `<div class="rk-judul k1">1K+ views (${k1.length})</div>${k1.map(item).join('')}` : ''}
      ${k5.length ? `<div class="rk-judul k5">500 - 999 views (${k5.length})</div>${k5.map(item).join('')}` : ''}
      ${(!k1.length && !k5.length) ? '<div class="rk-kosong">Belum ada video yang tembus 500 views.</div>' : ''}
      <details class="rk-semua" data-akun="${esc(akun)}"${bukaAkun[akun] ? ' open' : ''}>
        <summary>Semua video bulan ini (${semua.length})</summary>
        ${semua.map(itemSemua).join('')}
      </details>
    </div>`;
  }).join('');
  pantauThumb();
  return totalLolos;
}

/* Thumbnail video: dimuat otomatis lewat Worker (oEmbed TikTok), hanya saat terlihat di layar */

const thumbAntri = {};
const bukaAkun = {};

  }
}

/* Cari alamat gambar cover di dalam HTML / JSON halaman TikTok */
function cariThumbDiHtml(t){
  const pola = [
    /"thumbnail_url"\s*:\s*"([^"]+)"/,
    /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i,
    /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i,
    /<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"']+)["']/i,
    /"originCover"\s*:\s*"([^"]+)"/,
    /"dynamicCover"\s*:\s*"([^"]+)"/,
    /"cover"\s*:\s*"(https?:[^"]+)"/,
    /"thumbnailUrl"\s*:\s*\[\s*"([^"]+)"/
  ];
  for(const re of pola){
    const m = String(t || '').match(re);
    if(m && m[1]){
      const u = m[1].replace(/\\u002F/g, '/').replace(/\\u0026/g, '&').replace(/\\\//g, '/').replace(/&amp;/g, '&');
      if(/^https?:\/\//i.test(u)) return u;
    }
  }
  return null;
}

async function ambilThumbBrowser(link){
  /* Link bersih tanpa parameter tambahan (berlaku untuk video maupun foto) */
  const bersih = String(link || '').split('?')[0].split('#')[0].replace(/\/+$/, '');

  /* Utama: lewat Worker (link bersih dulu, lalu link asli) */
  const daftarLink = bersih === link ? [link] : [bersih, link];
  for(const l of daftarLink){
    const j = await fetchJson(`${WORKER_URL}/?thumb=1&url=${encodeURIComponent(l)}`, 20000);
    if(j && j.ok && j.thumb) return j.thumb;
  }

  /* Cadangan: oEmbed TikTok + proxy publik (oEmbed mendukung video dan foto) */
  const oembed = 'https://www.tiktok.com/oembed?url=' + encodeURIComponent(bersih);
  const sumber = [
    oembed,
    'https://corsproxy.io/?' + encodeURIComponent(oembed),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(oembed),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(oembed),
    'https://corsproxy.io/?' + encodeURIComponent(bersih),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(bersih),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(bersih),
    'https://thingproxy.freeboard.io/fetch/' + bersih
  ];
  for(const u of sumber){
    const teks = await fetchTeksThumb(u, 12000);
    const gambar = teks ? cariThumbDiHtml(teks) : null;
    if(gambar) return gambar;
  }
  return null;
}

async function muatThumb(el){
  const link = el.dataset.link;
  if(thumbCache[link] || thumbAntri[link]) return;
  thumbAntri[link] = true;
  const url = await ambilThumbBrowser(link);
  delete thumbAntri[link];
  thumbCache[link] = url || 'gagal';
  document.querySelectorAll('#laporan-list .thumb').forEach(a => {
    if(a.dataset.link === link) a.innerHTML = isiThumb(link);
  });
}

const obsThumb = ('IntersectionObserver' in window) ? new IntersectionObserver(list => {
  list.forEach(en => {
    if(en.isIntersecting){
      obsThumb.unobserve(en.target);
      muatThumb(en.target);
    }
  });
}, { rootMargin: '200px' }) : null;

function pantauThumb(){
  document.querySelectorAll('#laporan-list .thumb').forEach(a => {
    if(thumbCache[a.dataset.link]) return;
    if(obsThumb) obsThumb.observe(a);
    else muatThumb(a);
  });
}

/* ===== Riwayat hapus: pulihkan, hapus permanen, auto hapus 7 hari ===== */

/* Pulihkan: kembalikan ke absensi + kembalikan link di state karyawan */
async function pulihkanAbsen(key, tombol){
  const r = semuaHapus.find(x => x._key === key);
  if(!r) return;
  const kunciAbsen = `${r.tanggal}_${r.nomor}_${kunciNama(r.nama)}`;

  tombol.disabled = true;
  try{
    const ada = await db.ref('absensi/' + kunciAbsen).once('value');
    if(ada.exists()){
      tombol.disabled = false;
      popupInfo('Tidak bisa dipulihkan', 'Karyawan sudah mengisi ulang link ini.');
      return;
    }
  }catch(err){
    tombol.disabled = false;
    popupInfo('Gagal memeriksa data', (err && err.message) || 'koneksi gagal');
    return;
  }

  const yakin = await popupKonfirmasi(
    'Pulihkan absensi ini?',
    'Data akan kembali ke tab Absensi.',
    [['Nama', r.nama], ['Akun', r.akun], ['Link', r.link]],
    'Ya, Pulihkan',
    false
  );
  if(!yakin){
    tombol.disabled = false;
    return;
  }

  const jamPenuh = /^\d{2}:\d{2}:\d{2}$/.test(r.jam) ? r.jam : '00:00:00';
  const ts = new Date(`${r.tanggal}T${jamPenuh}`).getTime() || Date.now();
  const upd = {};
  upd['absensi/' + kunciAbsen] = {
    nama: r.nama || '-',
    platform: r.platform || '-',
    akun: r.akun || '-',
    jadwal: r.jadwal || '-',
    link: r.link || '-',
    nomor: r.nomor || 0,
    tanggal: r.tanggal,
    jam: r.jam || '-',
    ts: ts
  };
  upd['riwayat_hapus/' + key] = null;

  try{
    await db.ref().update(upd);
  }catch(err){
    tombol.disabled = false;
    popupInfo('Gagal memulihkan', (err && err.message) || 'koneksi gagal');
    return;
  }
  try{
    await pulihkanStateKaryawan(r);
  }catch(err){
    console.error('Gagal memulihkan state karyawan:', err);
  }
  toast('Absensi berhasil dipulihkan');
}

/* Kembalikan link di state karyawan (status selesai ikut pulih kalau kelima link lengkap) */
function pulihkanStateKaryawan(r){
  const [y, m, d] = String(r.tanggal).split('-');
  const bulanKey = `absen-${y}-${m}`;
  const hari = String(parseInt(d));
  const jamPendek = String(r.jam).slice(0, 5);

  return db.ref('state/' + kunciNama(r.nama)).transaction(cur => {
    if(typeof cur !== 'string' || !cur.startsWith(MARKER)) return cur;
    let obj;
    try{ obj = JSON.parse(cur.slice(MARKER.length)); }catch(err){ return cur; }
    if(obj.month !== bulanKey) return cur;

    if(!obj.data) obj.data = {};
    if(!obj.data[hari]) obj.data[hari] = {};
    const e = obj.data[hari];
    if(!e.links) e.links = {};
    e.links[r.nomor] = { nilai: r.link, jam: jamPendek };
    if([1, 2, 3, 4, 5].every(n => e.links[n])){
      e.posting = true;
      e.posting_waktu = jamPendek;
    }
    e.t = Date.now();
    return MARKER + JSON.stringify(obj);
  });
}

/* Hapus permanen satu riwayat */
async function hapusPermanen(key, tombol){
  const r = semuaHapus.find(x => x._key === key);
  if(!r) return;
  const yakin = await popupKonfirmasi(
    'Hapus permanen?',
    'Data ini tidak bisa dipulihkan lagi.',
    [['Nama', r.nama], ['Akun', r.akun], ['Link', r.link]],
    'Ya, Hapus Permanen',
    true
  );
  if(!yakin) return;
  tombol.disabled = true;
  try{
    await db.ref('riwayat_hapus/' + key).remove();
    toast('Dihapus permanen');
  }catch(err){
    tombol.disabled = false;
    popupInfo('Gagal menghapus', (err && err.message) || 'koneksi gagal');
  }
}

/* Auto hapus riwayat yang sudah lebih dari 7 hari */
async function bersihkanKadaluarsa(){
  try{
    const batas = Date.now() - MASA_SIMPAN_MS;
    const snap = await db.ref('riwayat_hapus').orderByChild('hapus_ts').endAt(batas).once('value');
    const upd = {};
    let ada = false;
    snap.forEach(c => { upd['riwayat_hapus/' + c.key] = null; ada = true; });
    if(ada) await db.ref().update(upd);
  }catch(err){
    console.error('Gagal membersihkan riwayat kadaluarsa:', err);
  }
}
bersihkanKadaluarsa();
setInterval(bersihkanKadaluarsa, 60 * 60 * 1000);
setInterval(render, 60 * 60 * 1000);

  const btnPermanen = e.target.closest('.btn-permanen');

});
