<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Panduan</title>
<meta name="description" content="Dashboard panduan internal">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2197f3">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232197f3'/%3E%3Cpath d='M8 9h7v14H8zM17 9h7v14h-7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#f4f8fc;--card:#fff;--tx:#5d596c;--hd:#443f55;--mut:#a5a2ad;--bd:#e6e5ea;--pr:#2197f3;--pr2:#4eb0f8;--soft:#e8f4fe}
body.dark{--bg:#1b2634;--card:#243244;--tx:#c9d6e6;--hd:#e8f1fb;--mut:#8497ad;--bd:#34465b;--soft:#2b3d53}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}

/* SIDEBAR */
.side{position:fixed;inset:0 auto 0 0;width:260px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:50;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;padding:20px 22px 14px;font-size:20px;font-weight:700;color:var(--hd)}
.brand i{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;display:grid;place-items:center;font-size:15px}
.nav{flex:1;overflow-y:auto;padding:4px 12px 16px}
.nav h6{font-size:11px;font-weight:500;letter-spacing:.4px;color:var(--mut);margin:16px 10px 8px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;margin-bottom:3px;border-radius:7px;color:var(--tx);text-decoration:none;font-size:14px;cursor:pointer}
.nav a:hover{background:var(--soft)}
.nav a.on{background:linear-gradient(72deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 2px 8px rgba(33,151,243,.4)}
.nav a span:first-child{width:20px;text-align:center;font-size:15px}
.shade{display:none;position:fixed;inset:0;background:rgba(20,20,40,.45);z-index:40}

/* MAIN */
.main{margin-left:260px;padding:14px 22px 18px;height:100vh;display:flex;flex-direction:column}
#home{flex:1;min-height:0;overflow-y:auto;padding-bottom:6px}
.top{flex-shrink:0;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:8px;padding:10px 18px;margin-bottom:22px;box-shadow:0 2px 8px rgba(75,70,92,.08)}
.top .ttl{flex:1;font-weight:600;color:var(--hd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:var(--tx)}
.ic:hover{background:var(--soft)}
#burger{display:none}
.user{display:flex;align-items:center;gap:9px;font-size:13px;line-height:1.2;color:var(--hd)}
.user small{display:block;color:var(--mut)}
.av{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--pr);display:grid;place-items:center;font-weight:700}
.card{background:var(--card);border-radius:8px;box-shadow:0 2px 8px rgba(75,70,92,.08);padding:20px;margin-bottom:22px}
.card h3{font-size:16px;font-weight:500;color:var(--hd);margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.st{display:flex;align-items:center;gap:12px}
.st b{display:block;font-size:16px;color:var(--hd);font-weight:600}
.st small{color:var(--mut)}
.bub{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex-shrink:0;background:var(--soft);color:var(--pr)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.groups .card{margin:0}
.grp a{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:8px;cursor:pointer;color:var(--tx);text-decoration:none}
.grp a:hover{background:var(--soft)}
.grp a em{margin-left:auto;font-style:normal;color:var(--mut);font-size:18px}
.grp .bub{width:34px;height:34px;font-size:14px;border-radius:9px}

/* PREVIEW */
#view{display:none;padding:0;overflow:hidden;position:relative;flex:1;min-height:0;margin:0;flex-direction:column}
.vh{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.vh b{flex:1;color:var(--hd);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh button,.vh a{padding:7px 11px;border-radius:7px;font-size:13px;color:var(--tx);text-decoration:none;background:var(--soft)}
.vu{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--bd);background:var(--bg)}
.vu i.fa-link{color:var(--pr);font-size:13px}
#vl{flex:1;min-width:0;font-size:13px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vc{width:32px;height:32px;border-radius:7px;background:var(--soft);color:var(--pr);display:grid;place-items:center;flex-shrink:0}
#vc:hover{background:var(--pr);color:#fff}
#vc.ok{background:#28c76f;color:#fff}
.vb{flex:1;min-height:0;position:relative;display:flex}
#frame{flex:1;width:100%;border:0;background:#fff}
#load{position:absolute;inset:0;z-index:1;display:grid;place-items:center;background:var(--card);color:var(--mut)}
#load::before{content:"";width:34px;height:34px;border:3px solid var(--soft);border-top-color:var(--pr);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:60px;position:absolute}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#load::before{animation:none}}

@media(max-width:900px){
 .side{transform:translateX(-100%)}
 .side.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.25)}
 .shade.open{display:block}
 .main{margin-left:0;padding:10px}
 #burger{display:grid}
 .user div{display:none}
 .stats{grid-template-columns:repeat(2,1fr)}
}

/* GATE */
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99999}
.gbox{width:100%;max-width:350px;background:var(--card);padding:24px;border-radius:12px;box-shadow:0 8px 28px rgba(75,70,92,.14);text-align:center}
.gbox h2 i{color:var(--pr);margin-right:6px}
.gbox h2{font-size:20px;color:var(--hd);margin-bottom:8px}
.gbox p{font-size:13px;color:var(--mut);line-height:1.5;margin-bottom:16px}
.gbox input{width:100%;padding:13px;border:1px solid var(--bd);border-radius:8px;font-size:14px;text-align:center;background:var(--bg);color:var(--tx);outline:none}
.gbox input:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(33,151,243,.18)}
.gbox .go{width:100%;margin-top:11px;padding:13px;border-radius:8px;background:linear-gradient(72deg,var(--pr),var(--pr2));color:#fff;font-weight:600}
.gbox .bio{width:100%;margin-bottom:12px;padding:13px;border-radius:8px;background:var(--soft);color:var(--pr);font-weight:600;display:none}
.gbox .skip{margin-top:10px;padding:8px;color:var(--mut);font-size:13px}
#err{color:#ea5455;margin-top:10px;font-size:13px;min-height:18px}
</style>
</head>
<body>

<!-- ================= AKSES ================= -->
<div id="gate">
  <div class="gbox">
    <h2><i class="fa-solid fa-lock"></i>Kode Akses</h2>

    <div id="st1">
      <p>Masukkan kode akses untuk membuka dashboard panduan. Cukup sekali di perangkat ini.</p>
      <input type="password" id="accessCode" placeholder="Masukkan kode akses" autocomplete="off">
      <button class="go" id="btnAccess">Masuk</button>
    </div>

    <div id="st2" style="display:none">
      <p>Kode benar. Daftarkan sidik jari perangkat ini supaya tidak perlu mengisi lagi.</p>
      <button class="go" id="btnBio" style="margin-top:0"><i class="fa-solid fa-fingerprint"></i> Daftarkan sidik jari</button>
      <button class="skip" id="btnSkip">Lewati</button>
    </div>

    <div id="err"></div>
  </div>
</div>

<!-- ================= SIDEBAR ================= -->
<aside class="side" id="side">
  <div class="brand"><i class="fa-solid fa-book-open"></i> PANDUAN</div>
  <nav class="nav" id="nav"></nav>
</aside>
<div class="shade" id="shade"></div>

<!-- ================= MAIN ================= -->
<div class="main">
  <header class="top">
    <button class="ic" id="burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    <div class="ttl" id="ttl">Dashboard</div>
    <button class="ic" id="mode" title="Mode gelap" aria-label="Mode gelap"><i class="fa-solid fa-moon" id="modeIc"></i></button>
    <button class="ic" id="out" title="Reset akses" aria-label="Reset akses"><i class="fa-solid fa-rotate-left"></i></button>
    <div class="user"><div>Admin<small>panduan</small></div><div class="av">A</div></div>
  </header>

  <section id="home">
    <div class="card">
      <h3>Ringkasan</h3>
      <div class="stats">
        <div class="st"><div class="bub"><i class="fa-solid fa-book"></i></div><div><b id="sTot">0</b><small>Panduan</small></div></div>
        <div class="st"><div class="bub"><i class="fa-solid fa-layer-group"></i></div><div><b id="sGrp">0</b><small>Kategori</small></div></div>
        <div class="st"><div class="bub"><i class="fa-solid fa-shield-halved"></i></div><div><b>Aktif</b><small>Kode akses</small></div></div>
        <div class="st"><div class="bub"><i class="fa-solid fa-fingerprint"></i></div><div><b id="sBio">-</b><small>Sidik jari</small></div></div>
      </div>
    </div>
    <div class="groups" id="groups"></div>
  </section>

  <section class="card" id="view">
    <div class="vh">
      <b id="vt"></b>
      <button id="vr">Muat ulang</button>
      <a id="vo" target="_blank" rel="noopener">Tab baru</a>
    </div>
    <div class="vu">
      <i class="fa-solid fa-link"></i>
      <span id="vl"></span>
      <button id="vc" title="Salin link" aria-label="Salin link"><i class="fa-regular fa-copy"></i></button>
    </div>
    <div class="vb">
      <div id="load">Memuat halaman...</div>
      <iframe id="frame" title="Preview halaman"></iframe>
    </div>
  </section>
</div>

<!-- ================= ANTI DEVTOOLS ================= -->
<script>
setInterval(() => {
  if (
    window.outerWidth - window.innerWidth > 150 ||
    window.outerHeight - window.innerHeight > 150
  ){
    document.documentElement.innerHTML = "";
    document.body.style.display = "none";
    while(true){
      history.pushState(null,null,location.href);
    }
  }
},300);
</script>

<script>
/* ================= DATA MENU ================= */
const MENU = [
 {g:"Panduan", items:[
  ["fa-wallet","Cara Topup E-Wallet","/cara-topup-ewallet"],
  ["fa-circle-play","Tutorial QRIS MerchantPay","/MerchantPay"],
  ["fa-file-contract","S&K - Rp2.000","/B-Ketentuan-Qris"],
  ["fa-calendar-days","Jadwal QRIS MerchantPay","/Jadwal-Qris-MerchantPay"],
  ["fa-clipboard-list","S&K QRIS MerchantPay","/B-Ketentuan-Qris-MerchantPay"],
  ["fa-scroll","Syarat & Ketentuan FM","/S&K-FM"]]},
 {g:"Layanan", items:[
  ["fa-headset","GMIMIK CS","/prankcs"],
  ["fa-lock","Pembekuan Akun","/beku"],
  ["fa-triangle-exclamation","JUDI FT","/D-Membatasi-Pemblokiran-Akun"],
  ["fa-screwdriver-wrench","Maintenance","/MT"],
  ["fa-mobile-screen","Page FM","/download.FamsssPay.app"],
  ["fa-bell","NOTIF","/notif"]]},
 {g:"Operasional", items:[
  ["fa-user-check","ABSEN","/absen"],
  ["fa-user-check","ABSEN TIKTOK","/absen-tiktok"],
  ["fa-user-check","ABSEN YT","/absen-yt"],
  ["fa-chart-column","LAPORAN FM","/Hitung-TRX"],
  ["fa-chart-line","DASHBOARD KPL","/DSB-KPL"],
  ["fa-receipt","REKAP TRX","/rekap"],
  ["fa-comment-dots","KOMPLAIN","/komplain"]]}
];
const FLAT = []; MENU.forEach(m => m.items.forEach(i => FLAT.push(i)));

const $ = id => document.getElementById(id);
const side = $("side"), shade = $("shade");

/* ================= RENDER ================= */
let nav = '<a data-i="-1" class="on"><span><i class="fa-solid fa-house"></i></span><span>Dashboard</span></a>', groups = '', n = 0;
MENU.forEach(m => {
  nav += '<h6>' + m.g + '</h6>';
  groups += '<div class="card grp"><h3>' + m.g + '</h3>';
  m.items.forEach(it => {
    nav += '<a data-i="' + n + '"><span><i class="fa-solid ' + it[0] + '"></i></span><span>' + it[1] + '</span></a>';
    groups += '<a data-i="' + n + '"><div class="bub"><i class="fa-solid ' + it[0] + '"></i></div><span>' + it[1] + '</span><em><i class="fa-solid fa-chevron-right"></i></em></a>';
    n++;
  });
  groups += '</div>';
});
$("nav").innerHTML = nav;
$("groups").innerHTML = groups;
$("sTot").textContent = FLAT.length;
$("sGrp").textContent = MENU.length;

/* ================= PREVIEW DI DALAM DASHBOARD ================= */
function show(i){
  const home = i < 0 || !FLAT[i];
  $("home").style.display = home ? "block" : "none";
  $("view").style.display = home ? "none" : "flex";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", +a.dataset.i === (home ? -1 : i)));
  $("ttl").textContent = home ? "Dashboard" : FLAT[i][1];
  if(!home){
    const url = FLAT[i][2];
    $("vt").innerHTML = '<i class="fa-solid ' + FLAT[i][0] + '"></i>&nbsp; ' + FLAT[i][1];
    const full = new URL(url, location.href).href;
    $("vo").href = full;
    $("vl").textContent = full;
    $("vl").title = full;
    $("load").style.display = "grid";
    $("frame").src = url;
  } else {
    $("frame").src = "about:blank";
  }
  closeSide();
  $("home").scrollTop = 0;
}
function go(i){ location.hash = i < 0 ? "" : "#m" + i; }
function route(){
  const m = /^#m(\d+)$/.exec(location.hash);
  show(m ? +m[1] : -1);
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-i]");
  if(a) go(+a.dataset.i);
});
window.addEventListener("hashchange", route);
$("frame").addEventListener("load", () => { $("load").style.display = "none"; });
$("vc").onclick = async () => {
  const t = $("vl").textContent;
  try{
    await navigator.clipboard.writeText(t);
  }catch(e){
    const a = document.createElement("textarea");
    a.value = t; a.style.position = "fixed"; a.style.opacity = "0";
    document.body.appendChild(a); a.select();
    try{ document.execCommand("copy"); }catch(x){}
    a.remove();
  }
  const b = $("vc");
  b.classList.add("ok");
  b.innerHTML = '<i class="fa-solid fa-check"></i>';
  setTimeout(() => { b.classList.remove("ok"); b.innerHTML = '<i class="fa-regular fa-copy"></i>'; }, 1500);
};
$("vr").onclick = () => { $("load").style.display = "grid"; $("frame").src = $("frame").src; };

/* sidebar mobile */
function openSide(){ side.classList.add("open"); shade.classList.add("open"); }
function closeSide(){ side.classList.remove("open"); shade.classList.remove("open"); }
$("burger").onclick = openSide;
shade.onclick = closeSide;

/* mode gelap */
if(localStorage.getItem("dash_dark") === "1") document.body.classList.add("dark");
function modeIcon(){ $("modeIc").className = "fa-solid " + (document.body.classList.contains("dark") ? "fa-sun" : "fa-moon"); }
modeIcon();
$("mode").onclick = () => {
  document.body.classList.toggle("dark");
  localStorage.setItem("dash_dark", document.body.classList.contains("dark") ? "1" : "0");
  modeIcon();
};

/* ================= ACCESS ================= */
const ACCESS_CODE = "5678";

const gate = $("gate"), input = $("accessCode"), err = $("err");
const granted = () => localStorage.getItem("dashboard_access") === "granted";
const bioOn = () => !!localStorage.getItem("bio_cred");

/* Sudah masuk: simpan, tidak diminta lagi */
function finish(){
  localStorage.setItem("dashboard_access","granted");
  gate.style.display = "none";
  bioLabel();
  route();
}

/* ================= SIDIK JARI (WebAuthn) ================= */
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const rnd = n => crypto.getRandomValues(new Uint8Array(n));

async function bioSupported(){
  try{
    return !!(window.PublicKeyCredential && window.isSecureContext &&
      await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  }catch(e){ return false; }
}

async function bioRegister(){
  const c = await navigator.credentials.create({publicKey:{
    challenge: rnd(32),
    rp: {name:"Dashboard Panduan"},
    user: {id: rnd(16), name:"admin", displayName:"Admin"},
    pubKeyCredParams: [{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
    authenticatorSelection: {authenticatorAttachment:"platform", userVerification:"required"},
    timeout: 60000
  }});
  localStorage.setItem("bio_cred", b64(c.rawId));
}

function bioLabel(){
  bioSupported().then(ok => {
    $("sBio").textContent = !ok ? "Tidak didukung" : (bioOn() ? "Aktif" : "Nonaktif");
  });
}

/* Langkah 1: kode akses */
async function checkAccess(){
  if(input.value !== ACCESS_CODE){
    err.textContent = "Kode akses salah.";
    input.value = "";
    input.focus();
    return;
  }
  err.textContent = "";
  if(!bioOn() && await bioSupported()){
    $("st1").style.display = "none";
    $("st2").style.display = "block";      // langkah 2: sidik jari
  }else{
    finish();
  }
}
$("btnAccess").addEventListener("click", checkAccess);
input.addEventListener("keydown", e => { if(e.key === "Enter") checkAccess(); });

/* Langkah 2: daftar sidik jari */
$("btnBio").onclick = async () => {
  try{
    await bioRegister();
    finish();
  }catch(e){
    err.textContent = "Sidik jari gagal atau dibatalkan. Coba lagi atau lewati.";
  }
};
$("btnSkip").onclick = finish;

/* Reset: hapus akses & sidik jari, minta isi ulang */
$("out").onclick = () => {
  if(confirm("Reset akses? Kode akses dan sidik jari harus diisi ulang.")){
    localStorage.removeItem("dashboard_access");
    localStorage.removeItem("bio_cred");
    location.reload();
  }
};

/* ================= START ================= */
bioLabel();
if(granted()){
  gate.style.display = "none";
  route();
}
</script>
</body>
</html>
