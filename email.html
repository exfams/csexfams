<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan Kendala</title>
<style>
:root{
  --accent:#2196f3;
  --accent-soft:rgba(33,150,243,.10);
  --accent-line:rgba(33,150,243,.35);
  --bg:#eef5fc;--card:#fff;--text:#14202b;--muted:#5f7283;--line:#dbe5ef;--field:#f6f9fd;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--accent-soft:rgba(33,150,243,.16);--bg:#0e141b;--card:#161e27;--text:#e8eef4;--muted:#8fa2b3;--line:#263341;--field:#1b2531}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,textarea{outline:none}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(33,150,243,.10)}
.top{background:var(--accent);color:#fff;padding:22px 24px;display:flex;gap:14px;align-items:center}
.top .badge{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}
.top svg{width:24px;height:24px}
.top h1{margin:0;font-size:1.15rem;font-weight:700}
.top p{margin:2px 0 0;font-size:.82rem;opacity:.9}
.body{padding:22px 24px 24px}
.lbl{display:block;font-size:.72rem;color:var(--accent);margin:18px 0 8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.lbl:first-child{margin-top:0}
.field{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:.95rem;word-break:break-all}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:.95rem;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;-webkit-appearance:none;appearance:none}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.opt .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .15s}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt[aria-checked="true"] .dot{border-color:var(--accent)}
.opt[aria-checked="true"] .dot::after{transform:scale(1)}
.opt:focus-visible{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:stretch}
.row .field{flex:1;font-weight:600}
.icon-btn{width:44px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-appearance:none;appearance:none}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn svg{width:18px;height:18px}
textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:10px;padding:12px;font:inherit;font-size:.95rem}
textarea:focus{border-color:var(--accent)}
.send{width:100%;margin-top:22px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none;appearance:none}
.send svg{width:18px;height:18px}
.send:active{opacity:.88}
.alt{width:100%;margin-top:6px;background:none;border:0;color:var(--accent);font:inherit;font-size:.85rem;padding:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;-webkit-appearance:none;appearance:none}
.alt svg{width:15px;height:15px}
.msg{font-size:.8rem;margin-top:8px;min-height:1em;color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="badge">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    </div>
    <div>
      <h1>Laporan Kendala</h1>
      <p>Tim kami siap membantu Anda</p>
    </div>
  </div>

  <div class="body">
    <span class="lbl">Kepada</span>
    <div class="field">famssspay@gmail.com</div>

    <span class="lbl">Jenis Kendala</span>
    <div class="opts" id="opts" role="radiogroup" aria-label="Jenis kendala">
      <button type="button" class="opt" role="radio" aria-checked="true" data-v="Kendala Transaksi"><span class="dot"></span>Kendala Transaksi</button>
      <button type="button" class="opt" role="radio" aria-checked="false" data-v="Kendala Akun"><span class="dot"></span>Kendala Akun</button>
      <button type="button" class="opt" role="radio" aria-checked="false" data-v="Kendala Lainnya"><span class="dot"></span>Kendala Lainnya</button>
    </div>

    <span class="lbl">Subjek</span>
    <div class="row">
      <div class="field" id="subject"></div>
      <button class="icon-btn" id="regen" title="Buat ID baru" aria-label="Buat ID baru" type="button">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>

    <label class="lbl" for="msg">Pesan</label>
    <textarea id="msg" placeholder="Jelaskan kendala yang Anda alami"></textarea>
    <div class="msg" id="status"></div>

    <button class="send" id="send" type="button">
      <svg viewBox="0 0 24 24"><path d="m22 2-11 11"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      Kirim lewat Gmail
    </button>
    <button class="alt" id="web" type="button">
      <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      Buka Gmail versi web
    </button>
  </div>
</div>

<script>
var TO = "famssspay@gmail.com";
var ticket, kategori = "Kendala Transaksi";
var $ = function(id){ return document.getElementById(id); };

function subj(){ return kategori + " #" + ticket; }
function renderSubject(){ $("subject").textContent = subj(); }
function newTicket(){
  ticket = Math.floor(1000 + Math.random() * 9000);
  renderSubject();
}

// Pilihan jenis kendala
var opts = document.querySelectorAll(".opt");
Array.prototype.forEach.call(opts, function(b){
  b.onclick = function(){
    Array.prototype.forEach.call(opts, function(x){ x.setAttribute("aria-checked", "false"); });
    b.setAttribute("aria-checked", "true");
    kategori = b.getAttribute("data-v");
    renderSubject();
  };
});

function getMsg(){
  var m = $("msg").value.trim();
  if(!m){ $("status").textContent = "Pesan tidak boleh kosong."; return null; }
  $("status").textContent = "";
  return m;
}

$("regen").onclick = newTicket;

// Buka aplikasi Gmail / email default
$("send").onclick = function(){
  var m = getMsg(); if(!m) return;
  window.location.href = "mailto:" + TO +
    "?subject=" + encodeURIComponent(subj()) +
    "&body=" + encodeURIComponent(m);
};

// Cadangan: Gmail versi web
$("web").onclick = function(){
  var m = getMsg(); if(!m) return;
  window.open("https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(TO) +
    "&su=" + encodeURIComponent(subj()) +
    "&body=" + encodeURIComponent(m), "_blank", "noopener");
};

newTicket();
</script>
</body>
</html>
